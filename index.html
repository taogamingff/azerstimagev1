<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0">

<title>
AZERST - CÔNG CỤ CHÈN ẢNH TẠO LINK URL
</title>

<link
  rel="icon"
  href="https://Azerst-Image-VN.vercel.app/images/3rYKxqbI.png">

<style>

@font-face{
  font-family:"GFF";
  src:
    url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff2")
    format("woff2"),
    url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff")
    format("woff");
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{

  min-height:100vh;

  padding:18px;

  display:flex;

  align-items:center;

  justify-content:center;

  color:#fff;

  font-family:GFF,Arial,sans-serif;

  background:
    radial-gradient(
      circle at 10% 10%,
      rgba(117,76,255,.35),
      transparent 35%
    ),
    radial-gradient(
      circle at 90% 90%,
      rgba(255,45,155,.25),
      transparent 35%
    ),
    linear-gradient(
      135deg,
      #05000d,
      #18062e,
      #05000d
    );

  overflow-x:hidden;
}

body::before{

  content:"";

  position:fixed;

  inset:0;

  pointer-events:none;

  background-image:
    radial-gradient(
      circle,
      rgba(255,255,255,.8) 1px,
      transparent 1px
    );

  background-size:70px 70px;

  opacity:.15;
}

.card{

  position:relative;

  width:100%;

  max-width:650px;

  padding:30px 22px;

  border-radius:28px;

  border:
    1px solid
    rgba(255,255,255,.14);

  background:
    rgba(12,8,28,.78);

  backdrop-filter:blur(22px);

  -webkit-backdrop-filter:blur(22px);

  box-shadow:
    0 30px 80px rgba(0,0,0,.55),
    0 0 60px rgba(120,70,255,.15);
}

.logo{

  display:block;

  width:88px;

  height:88px;

  object-fit:cover;

  margin:0 auto 18px;

  border-radius:22px;

  box-shadow:
    0 0 35px
    rgba(130,80,255,.55);
}

h1{

  margin:0;

  text-align:center;

  font-size:24px;

  line-height:1.35;
}

.desc{

  margin:
    12px auto 25px;

  max-width:550px;

  text-align:center;

  color:#d5cedf;

  font-family:Arial,sans-serif;

  font-size:14px;

  line-height:1.6;
}

.upload{

  display:block;

  padding:36px 15px;

  text-align:center;

  border:
    2px dashed
    rgba(255,255,255,.22);

  border-radius:20px;

  cursor:pointer;

  transition:.25s;
}

.upload:hover{

  border-color:#9c72ff;

  background:
    rgba(130,80,255,.08);
}

.upload-title{

  display:block;

  margin-bottom:9px;

  font-size:18px;
}

.upload-sub{

  color:#aaa2b7;

  font-family:Arial,sans-serif;

  font-size:13px;

  line-height:1.6;
}

#file{
  display:none;
}

.info{

  display:none;

  margin-top:18px;

  padding:15px;

  border-radius:16px;

  background:
    rgba(255,255,255,.06);

  font-family:Arial,sans-serif;

  font-size:14px;

  line-height:1.8;

  word-break:break-word;
}

.progress{

  display:none;

  margin-top:18px;
}

.progress-bg{

  width:100%;

  height:10px;

  overflow:hidden;

  border-radius:20px;

  background:
    rgba(255,255,255,.1);
}

.progress-bar{

  width:0%;

  height:100%;

  border-radius:20px;

  background:
    linear-gradient(
      90deg,
      #754cff,
      #e63cff
    );

  transition:width:.2s;
}

.status{

  margin-top:10px;

  text-align:center;

  color:#ddd;

  font-family:Arial,sans-serif;

  font-size:13px;
}

.error{

  display:none;

  margin-top:16px;

  padding:14px;

  border-radius:14px;

  border:
    1px solid
    rgba(255,70,100,.25);

  background:
    rgba(255,40,80,.1);

  color:#ffb0bd;

  font-family:Arial,sans-serif;

  font-size:13px;

  word-break:break-word;
}

.result{

  display:none;

  margin-top:18px;
}

.url{

  width:100%;

  padding:14px;

  border:
    1px solid
    rgba(255,255,255,.1);

  border-radius:14px;

  outline:none;

  color:#fff;

  background:
    rgba(0,0,0,.3);

  font-family:Arial,sans-serif;

  font-size:13px;
}

.buttons{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;

  margin-top:12px;
}

button{

  padding:13px;

  border:0;

  border-radius:13px;

  color:#fff;

  cursor:pointer;

  font-family:GFF,Arial,sans-serif;

  background:
    linear-gradient(
      135deg,
      #754cff,
      #d73cff
    );
}

button:hover{
  filter:brightness(1.15);
}

.footer{

  margin-top:22px;

  text-align:center;

  color:#777083;

  font-family:Arial,sans-serif;

  font-size:11px;
}

@media(max-width:500px){

  body{
    padding:10px;
  }

  .card{
    padding:24px 15px;
    border-radius:23px;
  }

  h1{
    font-size:20px;
  }

  .buttons{
    grid-template-columns:1fr;
  }
}

</style>

</head>

<body>

<div class="card">

<img
  class="logo"
  src="https://Azerst-Image-VN.vercel.app/images/3rYKxqbI.png"
  alt="Azerst">

<h1>
AZERST - CÔNG CỤ CHÈN ẢNH TẠO LINK URL
</h1>

<div class="desc">
Công cụ chèn ảnh và tạo link URL trực tiếp nhanh chóng từ Azerst.
Hỗ trợ Android, iPhone và máy tính.
</div>

<label
  class="upload"
  for="file">

<span class="upload-title">
📸 CHỌN ẢNH ĐỂ TẢI LÊN
</span>

<span class="upload-sub">
PNG • JPG • JPEG • WEBP • GIF • AVIF
<br>
Dung lượng tối đa: <b>10 GB</b>
</span>

</label>

<input
  id="file"
  type="file"
  accept="
    image/png,
    image/jpeg,
    image/webp,
    image/gif,
    image/avif">

<div
  id="info"
  class="info">
</div>

<div
  id="progress"
  class="progress">

<div class="progress-bg">

<div
  id="progressBar"
  class="progress-bar">
</div>

</div>

<div
  id="status"
  class="status">
Đang chuẩn bị...
</div>

</div>

<div
  id="error"
  class="error">
</div>

<div
  id="result"
  class="result">

<input
  id="url"
  class="url"
  readonly>

<div class="buttons">

<button id="copy">
📋 Sao chép URL
</button>

<button id="open">
🔗 Mở ảnh
</button>

<button id="html">
🧩 Copy HTML
</button>

<button id="new">
🔄 Ảnh mới
</button>

</div>

</div>

<div class="footer">
AZERST IMAGE VN
</div>

</div>

<script type="module">

import {
  upload
} from
"https://esm.sh/@vercel/blob@2.8.0/client";

const fileInput =
  document.getElementById("file");

const info =
  document.getElementById("info");

const progress =
  document.getElementById("progress");

const progressBar =
  document.getElementById("progressBar");

const status =
  document.getElementById("status");

const errorBox =
  document.getElementById("error");

const result =
  document.getElementById("result");

const urlInput =
  document.getElementById("url");

const IMAGE_DOMAIN =
  "https://Azerst-Image-VN.vercel.app";

const MAX_SIZE =
  10 * 1024 * 1024 * 1024;

const ALLOWED = [
  "image/png",
  "image/jpeg",
  "image/webp",
  "image/gif",
  "image/avif"
];

function sizeText(bytes){

  if(bytes < 1024)
    return bytes + " B";

  if(bytes < 1024 * 1024)
    return (
      bytes / 1024
    ).toFixed(2) + " KB";

  if(bytes < 1024 * 1024 * 1024)
    return (
      bytes / 1024 / 1024
    ).toFixed(2) + " MB";

  return (
    bytes /
    1024 /
    1024 /
    1024
  ).toFixed(2) + " GB";
}

function randomName(){

  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  let name = "";

  for(let i = 0; i < 9; i++){

    name +=
      chars[
        Math.floor(
          Math.random() *
          chars.length
        )
      ];

  }

  return name;
}

function extension(type){

  const map = {

    "image/png":"png",

    "image/jpeg":"jpg",

    "image/webp":"webp",

    "image/gif":"gif",

    "image/avif":"avif"

  };

  return map[type];
}

function error(message){

  errorBox.style.display =
    "block";

  errorBox.textContent =
    "❌ " + message;
}

function clearError(){

  errorBox.style.display =
    "none";

  errorBox.textContent =
    "";
}

fileInput.addEventListener(
  "change",
  async () => {

    clearError();

    const file =
      fileInput.files?.[0];

    if(!file)
      return;

    if(!ALLOWED.includes(file.type)){

      error(
        "Định dạng ảnh không được hỗ trợ."
      );

      fileInput.value = "";

      return;
    }

    if(file.size > MAX_SIZE){

      error(
        "Ảnh vượt quá giới hạn 10 GB."
      );

      fileInput.value = "";

      return;
    }

    info.style.display =
      "block";

    info.innerHTML =
      "<b>Tên file:</b> " +
      file.name +
      "<br>" +
      "<b>Dung lượng:</b> " +
      sizeText(file.size) +
      "<br>" +
      "<b>Định dạng:</b> " +
      file.type;

    progress.style.display =
      "block";

    result.style.display =
      "none";

    progressBar.style.width =
      "0%";

    status.textContent =
      "Đang tải lên...";

    try{

      const ext =
        extension(file.type);

      const pathname =
        randomName() +
        "." +
        ext;

      const blob =
        await upload(
          pathname,
          file,
          {

            access:"public",

            handleUploadUrl:
              "/api/upload",

            multipart:true,

            onUploadProgress:
              (event) => {

                const percent =
                  Number(
                    event.percentage || 0
                  );

                progressBar.style.width =
                  percent + "%";

                status.textContent =
                  "Đang tải: " +
                  Math.round(percent) +
                  "%";

              }

          }
        );

      const finalURL =
        IMAGE_DOMAIN +
        "/images/" +
        encodeURIComponent(
          pathname
        );

      urlInput.value =
        finalURL;

      progressBar.style.width =
        "100%";

      status.textContent =
        "✅ Upload thành công!";

      result.style.display =
        "block";

      console.log(
        "Blob URL:",
        blob.url
      );

    }catch(e){

      console.error(
        "UPLOAD ERROR:",
        e
      );

      error(
        e?.message ||
        "Lỗi Vercel Blob"
      );

      status.textContent =
        "Upload thất bại.";

    }

  }
);

document
.getElementById("copy")
.addEventListener(
  "click",
  async () => {

    if(!urlInput.value)
      return;

    try{

      await navigator.clipboard.writeText(
        urlInput.value
      );

      status.textContent =
        "✅ Đã sao chép URL";

    }catch{

      urlInput.select();

      document.execCommand(
        "copy"
      );

      status.textContent =
        "✅ Đã sao chép URL";

    }

  }
);

document
.getElementById("open")
.addEventListener(
  "click",
  () => {

    if(urlInput.value){

      window.open(
        urlInput.value,
        "_blank"
      );

    }

  }
);

document
.getElementById("html")
.addEventListener(
  "click",
  async () => {

    if(!urlInput.value)
      return;

    const html =
      '<img src="' +
      urlInput.value +
      '" alt="Azerst Image">';

    try{

      await navigator.clipboard.writeText(
        html
      );

      status.textContent =
        "✅ Đã sao chép HTML";

    }catch{

      status.textContent =
        "❌ Không thể sao chép";

    }

  }
);

document
.getElementById("new")
.addEventListener(
  "click",
  () => {

    fileInput.value =
      "";

    info.style.display =
      "none";

    progress.style.display =
      "none";

    result.style.display =
      "none";

    clearError();

    progressBar.style.width =
      "0%";

    status.textContent =
      "Đang chuẩn bị...";

  }
);

</script>

</body>
</html>
