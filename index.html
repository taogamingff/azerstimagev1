<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZERST - CHÈN ẢNH TẠO LINK</title>
<link rel="icon" href="https://azerst-image-vn.vercel.app/images/AVATA_AZERST.png">

<style>
@font-face{
  font-family:"GFF-Latin-Bold";
  src:
    url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff2") format("woff2"),
    url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff") format("woff");
}

:root {
  --glass-bg: rgba(14, 9, 30, 0.75);
  --glass-border: rgba(255, 255, 255, 0.1);
  --primary: #8c52ff;
  --secondary: #ff47c3;
  --text-main: #ffffff;
  --text-muted: #a399c4;
  --bevel: 20px;
}

* { box-sizing: border-box; font-family: "GFF-Latin-Bold", Arial, sans-serif; }
html, body { margin: 0; min-height: 100%; }

body {
  min-height: 100vh;
  padding: 30px 15px;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  color: var(--text-main);
  background:
    radial-gradient(circle at 0% 0%, rgba(140, 82, 255, .3), transparent 40%),
    radial-gradient(circle at 100% 100%, rgba(255, 71, 195, .2), transparent 40%),
    linear-gradient(135deg, #020005, #0d0420, #020005);
  background-attachment: fixed;
}

/* Khung chính */
.card {
  width: 100%;
  max-width: 700px;
  padding: 35px 25px;
  background: var(--glass-bg);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  clip-path: polygon(
    0 0, calc(100% - var(--bevel)) 0, 
    100% var(--bevel), 100% 100%, 
    var(--bevel) 100%, 0 calc(100% - var(--bevel))
  );
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 0 50px rgba(140, 82, 255, 0.05);
  position: relative;
}

.card::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent 30%, rgba(140,82,255,0.3));
  clip-path: inherit; z-index: -1; pointer-events: none;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude; padding: 1.5px;
}

/* Header */
.header { text-align: center; margin-bottom: 25px; }
.logo {
  width: 75px; height: 75px; margin: 0 auto 15px;
  object-fit: cover; border-radius: 18px;
  filter: drop-shadow(0 0 15px rgba(140, 82, 255, .6));
  transition: transform .3s;
}
.logo:hover { transform: scale(1.05) rotate(2deg); }

h1 {
  margin: 0 0 8px; font-size: 22px; letter-spacing: 1px;
  background: linear-gradient(135deg, #fff, var(--primary), var(--secondary));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.desc { color: var(--text-muted); font-size: 13px; }

/* Nhập tên */
.input-group { margin-bottom: 20px; }
.input-label { display: block; font-size: 13px; margin-bottom: 8px; color: #d1c4f5; }
.name-input {
  width: 100%; padding: 14px 16px; border-radius: 12px;
  border: 1px solid var(--glass-border); background: rgba(0, 0, 0, 0.4);
  color: #fff; font-size: 14px; outline: none; transition: .3s;
}
.name-input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(140, 82, 255, 0.2); }

/* Khung Upload (Đã nâng cấp) */
.upload-zone {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 35px 20px; border: 2px dashed rgba(140, 82, 255, 0.4); border-radius: 16px;
  background: rgba(140, 82, 255, 0.03); cursor: pointer; transition: .3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  position: relative; overflow: hidden;
}
.upload-zone::before {
  content: ""; position: absolute; inset: 0; background: radial-gradient(circle, rgba(140,82,255,0.1) 0%, transparent 70%);
  opacity: 0; transition: .3s;
}
.upload-zone:hover, .upload-zone.dragover {
  background: rgba(140, 82, 255, 0.1); border-color: var(--secondary);
  transform: translateY(-3px); box-shadow: 0 10px 30px rgba(255, 71, 195, 0.15);
}
.upload-zone:hover::before, .upload-zone.dragover::before { opacity: 1; }

.upload-icon {
  width: 45px; height: 45px; margin-bottom: 12px; color: var(--secondary);
  filter: drop-shadow(0 0 10px rgba(255,71,195,0.6)); transition: .3s;
}
.upload-zone:hover .upload-icon { transform: translateY(-5px); color: #fff; }
.upload-zone h3 { margin: 0 0 8px; font-size: 16px; color: #fff; z-index: 1; }
.upload-zone p { margin: 0; font-size: 12px; color: var(--text-muted); z-index: 1; }
#file { display: none; }

/* Khu vực danh sách kết quả */
.result-section { display: none; margin-top: 30px; animation: slideUp .4s ease; }
@keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

.status-banner {
  background: linear-gradient(90deg, rgba(140, 82, 255, 0.15), rgba(255, 71, 195, 0.15));
  border: 1px solid rgba(140, 82, 255, 0.3); border-radius: 12px;
  padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 20px; backdrop-filter: blur(10px);
}
.status-banner span { font-size: 14px; font-weight: bold; color: #e0d5ff; }
.btn-copy-all {
  background: #fff; color: #0d0420; border: none; padding: 10px 18px;
  border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; transition: .2s;
  box-shadow: 0 4px 15px rgba(255,255,255,0.2);
}
.btn-copy-all:hover { background: #d1c4f5; transform: scale(1.05); }

/* Thẻ ảnh (Đã nâng cấp) */
.file-item {
  display: flex; gap: 15px; padding: 16px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 16px; margin-bottom: 12px; position: relative;
  transition: .3s; animation: fadeIn .3s ease;
}
.file-item:hover { background: rgba(255, 255, 255, 0.06); border-color: rgba(140, 82, 255, 0.3); }
.file-item.error-item { border-color: rgba(255, 60, 90, 0.4); background: rgba(255, 60, 90, 0.05); }

.thumb {
  width: 70px; height: 70px; flex-shrink: 0; border-radius: 12px; overflow: hidden;
  background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}
.thumb img { width: 100%; height: 100%; object-fit: cover; }

.info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.f-name { font-size: 14px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; font-weight: bold; }
.f-status { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
.f-status.ok { color: #69f0ae; text-shadow: 0 0 8px rgba(105, 240, 174, 0.4); }
.f-status.err { color: #ff5252; text-shadow: 0 0 8px rgba(255, 82, 82, 0.4); }

/* Thanh URL & Nút Copy (Gộp chung) */
.url-box { display: none; margin-top: 10px; width: 100%; }
.url-group {
  display: flex; background: rgba(0,0,0,0.5); border-radius: 8px; overflow: hidden;
  border: 1px solid rgba(140, 82, 255, 0.3); transition: .3s;
}
.url-group:focus-within { border-color: var(--secondary); box-shadow: 0 0 12px rgba(255, 71, 195, 0.2); }
.f-url {
  flex: 1; padding: 10px 12px; background: transparent; border: none;
  color: #d1c4f5; font-size: 12px; outline: none; width: 100%;
}
.btn-copy {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  border: none; color: #fff; padding: 0 16px; cursor: pointer; font-size: 12px; font-weight: bold;
  transition: .2s;
}
.btn-copy:hover { filter: brightness(1.2); }

.remove-btn {
  position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1); border-radius: 50%;
  width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
  color: #888; cursor: pointer; font-size: 14px; transition: .2s;
}
.remove-btn:hover { background: rgba(255, 60, 90, 0.2); color: #ff5252; border-color: transparent; transform: rotate(90deg); }

/* Toast */
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translate(-50%, 20px);
  background: rgba(20, 15, 35, 0.95); border: 1px solid var(--primary);
  color: #fff; padding: 14px 24px; border-radius: 10px; font-size: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6); opacity: 0; pointer-events: none;
  transition: .3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 100;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 500px) {
  .card { padding: 25px 15px; }
  .file-item { flex-direction: column; align-items: center; text-align: center; }
  .thumb { width: 100%; height: 140px; margin-bottom: 10px; }
  .info { width: 100%; }
  .remove-btn { top: 10px; right: 10px; }
  .status-banner { flex-direction: column; gap: 10px; text-align: center; }
  .btn-copy-all { width: 100%; }
}
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <img class="logo" src="https://azerst-image-vn.vercel.app/images/AVATA_AZERST.png" alt="Logo">
    <h1>AZERST IMAGE UPLOAD</h1>
    <div class="desc">Tải ảnh nhanh, nhận link trực tiếp</div>
  </div>

  <div class="input-group">
    <label class="input-label" for="imageName">Tên ảnh muốn lưu (Không bắt buộc)</label>
    <input id="imageName" class="name-input" type="text" maxlength="50" placeholder="Ví dụ: Anh_Dai_Dien" autocomplete="off">
  </div>

  <label class="upload-zone" for="file" id="dropZone">
    <!-- Icon SVG Upload -->
    <svg class="upload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
    </svg>
    <h3>Chọn hoặc kéo thả ảnh vào đây</h3>
    <p>Hỗ trợ PNG, JPG, WEBP, GIF (Tối đa 10GB/ảnh)</p>
  </label>
  <input id="file" type="file" multiple accept="image/png,image/jpeg,image/webp,image/gif,image/avif">

  <!-- Khu vực hiển thị kết quả -->
  <div id="resultSection" class="result-section">
    <div class="status-banner">
      <span id="globalStatus">Hoàn tất!</span>
      <button class="btn-copy-all" id="btnCopyAll">Copy Tất Cả Link</button>
    </div>
    <div id="filesList"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { upload } from "https://esm.sh/@vercel/blob@2.8.0/client";

const IMAGE_SERVER = "https://azerst-image-vn.vercel.app";
const MAX_SIZE = 10 * 1024 * 1024 * 1024;
const ALLOWED = ["image/png", "image/jpeg", "image/webp", "image/gif", "image/avif"];

const fileInput = document.getElementById("file");
const nameInput = document.getElementById("imageName");
const dropZone = document.getElementById("dropZone");
const resultSection = document.getElementById("resultSection");
const filesList = document.getElementById("filesList");
const globalStatus = document.getElementById("globalStatus");
const btnCopyAll = document.getElementById("btnCopyAll");
const toast = document.getElementById("toast");

let uploads = [];
let idCounter = 0;

// Hàm tiện ích
const formatSize = (b) => b < 1048576 ? (b/1024).toFixed(1)+" KB" : (b/1048576).toFixed(1)+" MB";
const randomName = () => Array.from(crypto.getRandomValues(new Uint8Array(8)), v => "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"[v % 62]).join("");
const getExt = (t) => ({"image/png":"png","image/jpeg":"jpg","image/webp":"webp","image/gif":"gif","image/avif":"avif"})[t];
const cleanName = (v) => v.trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g,"d").replace(/Đ/g,"D").replace(/\s+/g,"_").replace(/[^A-Za-z0-9_-]/g, "");

const showToast = (msg) => {
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2500);
};

const copyText = async (text) => {
  try { await navigator.clipboard.writeText(text); return true; } 
  catch { 
    try {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); return true;
    } catch { return false; }
  }
};

const delay = (ms) => new Promise(res => setTimeout(res, ms));

// Tạo thẻ HTML cho từng ảnh (Đã nâng cấp giao diện)
function createItem(file, filename) {
  const id = ++idCounter;
  const thumbURL = URL.createObjectURL(file);
  const div = document.createElement("div");
  div.className = "file-item";
  div.dataset.id = id;
  div.innerHTML = `
    <div class="thumb"><img src="${thumbURL}" alt=""></div>
    <div class="info">
      <div class="f-name" title="${filename}">${filename}</div>
      <div class="f-status" id="st-${id}">Đang chờ xử lý...</div>
      <div class="url-box" id="box-${id}">
        <div class="url-group">
          <input class="f-url" id="url-${id}" readonly value="Đang tạo link...">
          <button class="btn-copy" data-copy="${id}">SAO CHÉP</button>
        </div>
      </div>
    </div>
    <button class="remove-btn" data-remove="${id}">×</button>
  `;
  return { div, id };
}

// Render UI kết quả
function updateUI() {
  resultSection.style.display = "block";
  const success = uploads.filter(u => u.status === "success").length;
  if (uploads.length === 0) {
    resultSection.style.display = "none";
    return;
  }
  globalStatus.textContent = `Đã tải lên thành công ${success}/${uploads.length} ảnh`;
}

// Xử lý upload 1 ảnh (Có cơ chế thử lại nếu lỗi mạng)
async function uploadOne(file, filename, id, attempt = 1) {
  const stEl = document.getElementById(`st-${id}`);
  const boxEl = document.getElementById(`box-${id}`);
  const urlEl = document.getElementById(`url-${id}`);
  
  stEl.textContent = `Đang tải lên... (Lần ${attempt})`;

  try {
    await upload(`images/${filename}`, file, {
      access: "public",
      handleUploadUrl: IMAGE_SERVER + "/api/upload",
      multipart: true,
    });

    const finalURL = `${IMAGE_SERVER}/images/${encodeURIComponent(filename)}`;
    
    stEl.textContent = "Tải lên thành công";
    stEl.className = "f-status ok";
    boxEl.style.display = "block";
    urlEl.value = finalURL;

    const entry = uploads.find(u => u.id === id);
    if (entry) { entry.url = finalURL; entry.status = "success"; }
    
    updateUI();

  } catch (err) {
    console.error(`Lỗi ảnh ${filename} (Lần ${attempt}):`, err);
    
    // Nếu lỗi do mạng và chưa quá 3 lần thử -> Thử lại
    if (attempt < 3) {
      stEl.textContent = `Lỗi mạng, đang thử lại (${attempt}/3)...`;
      await delay(1500);
      return uploadOne(file, filename, id, attempt + 1);
    }

    // Thất bại hoàn toàn
    stEl.textContent = "Lỗi kết nối mạng";
    stEl.className = "f-status err";
    stEl.closest(".file-item").classList.add("error-item");
    
    const entry = uploads.find(u => u.id === id);
    if (entry) entry.status = "error";
    updateUI();
  }
}

// Xử lý khi chọn file
async function handleFiles(files) {
  const validFiles = Array.from(files);
  if (!validFiles.length) return;

  const baseName = cleanName(nameInput.value);
  const queue = [];
  fileInput.value = ""; // Reset

  for (let i = 0; i < validFiles.length; i++) {
    const f = validFiles[i];
    if (!ALLOWED.includes(f.type) || f.size > MAX_SIZE) continue;

    let name = baseName ? (validFiles.length > 1 ? `${baseName}_${i+1}` : baseName) : randomName();
    const filename = `${name}.${getExt(f.type)}`;

    const { div, id } = createItem(f, filename);
    filesList.appendChild(div);
    uploads.push({ id, filename, url: null, status: "pending" });
    queue.push({ file: f, filename, id });
  }

  resultSection.style.display = "block";
  updateUI();

  // Tải tuần tự từng ảnh một
  for (const task of queue) {
    await uploadOne(task.file, task.filename, task.id);
    await delay(800); 
  }
}

// Events
fileInput.addEventListener("change", () => handleFiles(fileInput.files));
dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("dragover"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
dropZone.addEventListener("drop", e => { e.preventDefault(); dropZone.classList.remove("dragover"); handleFiles(e.dataTransfer.files); });

// Xử lý Copy & Remove
filesList.addEventListener("click", async (e) => {
  const copyBtn = e.target.closest("[data-copy]");
  const removeBtn = e.target.closest("[data-remove]");

  if (copyBtn) {
    const id = copyBtn.dataset.copy;
    const entry = uploads.find(u => u.id == id);
    if (entry && entry.url) {
      const ok = await copyText(entry.url);
      if (ok) showToast("Đã sao chép link ảnh!");
    }
  }

  if (removeBtn) {
    const id = Number(removeBtn.dataset.remove);
    const item = removeBtn.closest(".file-item");
    item.remove();
    uploads = uploads.filter(u => u.id !== id);
    updateUI();
  }
});

// Copy tất cả link
btnCopyAll.addEventListener("click", async () => {
  const urls = uploads.filter(u => u.status === "success" && u.url).map(u => u.url);
  if (urls.length === 0) {
    showToast("Chưa có ảnh nào được tải lên thành công!");
    return;
  }
  
  const ok = await copyText(urls.join("\n"));
  if (ok) showToast(`Đã sao chép ${urls.length} link!`);
});
</script>

</body>
</html>
