<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AZERST — Image Upload</title>
<link rel="icon" href="https://azerst-image-vn.vercel.app/images/AVATA_AZERST.png" />

<style>
  /* ================= FONT GFF ================= */
  @font-face{
    font-family:"GFF-Latin-Bold";
    src:
      url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff2") format("woff2"),
      url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff") format("woff");
    font-display:swap;
  }

  @font-face{
    font-family:"GFF-Latin-Black";
    src:
      url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Black.woff2") format("woff2"),
      url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Black.woff") format("woff");
    font-display:swap;
  }

  :root{
    --font-heading:"GFF-Latin-Black", "GFF-Latin-Bold", system-ui, sans-serif;
    --font-body:"GFF-Latin-Bold", system-ui, sans-serif;
    
    --red:#d93828;
    --red-dark:#b52a1c;
    --orange:#ff5e3a;
    --bg-main:#f4f6fa;
    --grid-color:rgba(0,0,0,0.04);
    
    --glass-bg: rgba(255, 255, 255, 0.7);
    --glass-border: rgba(255, 255, 255, 0.9);
    --cut: 24px;
  }

  *,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    min-height:100vh;
    overflow-x:hidden;
  }

  body{
    font-family: var(--font-body);
    background-color:var(--bg-main);
    background-image:
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size:32px 32px;
    background-position:center top;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px 15px;
    -webkit-font-smoothing:antialiased;
  }

  /* ============ QUẦNG SÁNG NỀN ============ */
  .glow{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(255,94,58,0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 70%, rgba(217,56,40,0.15) 0%, transparent 50%);
    filter:blur(60px); animation:pulseGlow 6s ease-in-out infinite alternate;
  }

  @keyframes pulseGlow{
    0%  { transform:scale(0.95); opacity:0.6; }
    100%{ transform:scale(1.05); opacity:1; }
  }

  /* ============ KHUNG KÍNH LỎNG CHÍNH ============ */
  .glass-container{
    width:min(650px, 100%);
    max-height:90vh;
    position:relative;
    background: var(--glass-bg);
    backdrop-filter:blur(30px) saturate(150%);
    -webkit-backdrop-filter:blur(30px) saturate(150%);
    /* Cắt 2 góc: Trên-Trái và Dưới-Phải */
    clip-path:polygon(
      var(--cut) 0, 100% 0,
      100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%,
      0 100%, 0 var(--cut)
    );
    box-shadow:
      0 1px 0 rgba(255,255,255,1) inset,
      0 30px 60px rgba(217,56,40,0.1);
    display:flex;
    flex-direction:column;
    isolation:isolate;
    animation:rise 0.8s cubic-bezier(.2,.8,.2,1) both;
  }

  /* Viền gradient Đỏ/Cam cho khung chính */
  .glass-container::before{
    content:""; position:absolute; inset:0;
    background: linear-gradient(135deg, var(--red), var(--orange), var(--red));
    clip-path: inherit; z-index:-1; pointer-events:none;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; padding: 2px;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(30px); filter:blur(5px); }
    to  { opacity:1; transform:translateY(0);    filter:blur(0); }
  }

  .content-scroll {
    padding: 35px 25px;
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .content-scroll::-webkit-scrollbar { width: 6px; }
  .content-scroll::-webkit-scrollbar-track { background: transparent; }
  .content-scroll::-webkit-scrollbar-thumb { background: rgba(217,56,40,0.3); border-radius: 10px; }
  .content-scroll::-webkit-scrollbar-thumb:hover { background: var(--red); }

  /* ============ HEADER ============ */
  .header { text-align: center; }
  .logo {
    width: 75px; height: 75px; margin: 0 auto 15px;
    object-fit: cover; border-radius: 18px;
    box-shadow: 0 8px 25px rgba(217,56,40,0.3);
    transition: transform 0.3s;
  }
  .logo:hover { transform: scale(1.05) rotate(3deg); }

  h1 { 
    font-family: var(--font-heading);
    color: var(--red); 
    font-size: 26px; 
    letter-spacing: 1px; 
    margin-bottom: 6px;
    text-transform: uppercase;
    text-shadow: 0 2px 10px rgba(217,56,40,0.2);
  }
  .desc { color: #666; font-size: 13px; font-weight: bold; }

  /* ============ NHẬP TÊN ============ */
  .input-group { display: flex; flex-direction: column; gap: 8px; }
  .input-label { font-size: 13px; color: var(--red-dark); }
  .name-input {
    width: 100%; padding: 14px 16px; border-radius: 12px;
    border: 1px solid rgba(217,56,40,0.2); background: rgba(255,255,255,0.6);
    color: #333; font-family: var(--font-body); font-size: 14px; outline: none; transition: .3s;
  }
  .name-input::placeholder { color: #aaa; }
  .name-input:focus { 
    border-color: var(--orange); 
    background: #fff; 
    box-shadow: 0 0 0 3px rgba(255,94,58,0.15); 
  }

  /* ============ VÙNG UPLOAD ============ */
  .upload-zone {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 20px; 
    border: 2px dashed var(--orange); 
    border-radius: 16px;
    background: rgba(255,255,255,0.5); 
    cursor: pointer; transition: .3s;
  }
  .upload-zone:hover, .upload-zone.dragover {
    background: rgba(255, 94, 58, 0.05); 
    border-color: var(--red);
    box-shadow: 0 10px 30px rgba(217,56,40,0.15); 
    transform: translateY(-2px);
  }
  .upload-icon { width: 45px; height: 45px; color: var(--red); margin-bottom: 12px; transition: .3s; }
  .upload-zone:hover .upload-icon { transform: translateY(-5px); color: var(--orange); }
  .upload-zone h3 { color: #333; font-size: 16px; margin-bottom: 6px; }
  .upload-zone p { color: #777; font-size: 12px; }
  #file { display: none; }

  /* ============ DANH SÁCH KẾT QUẢ ============ */
  .result-section { display: none; flex-direction: column; gap: 15px; }
  
  .status-banner {
    background: #fff; border: 1px solid rgba(217,56,40,0.3);
    border-radius: 12px; padding: 12px 18px; display: flex; justify-content: space-between;
    align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.03);
  }
  .status-banner span { font-size: 13px; color: var(--red-dark); }
  .btn-copy-all {
    background: linear-gradient(135deg, var(--red), var(--orange)); 
    color: #fff; border: none; padding: 8px 18px;
    border-radius: 8px; font-family: var(--font-body); font-size: 12px; cursor: pointer; transition: .2s;
    box-shadow: 0 4px 10px rgba(217,56,40,0.3);
  }
  .btn-copy-all:hover:not(:disabled) { transform: scale(1.05); filter: brightness(1.1); }
  .btn-copy-all:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Thẻ ảnh (Cắt 2 góc đối xứng) */
  .file-item {
    --item-cut: 16px;
    display: flex; gap: 15px; padding: 16px;
    background: #fff;
    /* Cắt góc Trên-Phải và Dưới-Trái */
    clip-path: polygon(
      0 0, calc(100% - var(--item-cut)) 0, 
      100% var(--item-cut), 100% 100%, 
      var(--item-cut) 100%, 0 calc(100% - var(--item-cut))
    );
    position: relative; transition: .3s; animation: slideIn .3s ease;
    border-left: 4px solid var(--orange);
  }
  .file-item:hover { box-shadow: 0 8px 25px rgba(217,56,40,0.08); }
  .file-item.error-item { border-left-color: #ff3b30; background: #fff5f5; }

  .thumb { width: 70px; height: 70px; flex-shrink: 0; border-radius: 8px; overflow: hidden; background: #eee; border: 1px solid #ddd; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }

  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .f-name { font-size: 14px; color: #222; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
  .f-status { font-size: 12px; color: #777; display: flex; align-items: center; gap: 8px; }
  .f-status.ok { color: #2f855a; }
  .f-status.err { color: var(--red); }

  /* Nút thử lại khi lỗi mạng */
  .btn-retry {
    background: #ff3b30; color: #fff; border: none; padding: 4px 10px;
    border-radius: 6px; font-size: 11px; cursor: pointer; display: none;
    font-family: var(--font-body);
  }
  .btn-retry:hover { background: #d93025; }

  /* Thanh URL & Nút Copy */
  .url-box { display: none; margin-top: 12px; width: 100%; }
  .url-group {
    display: flex; background: #f8f9fa; border-radius: 8px; overflow: hidden;
    border: 1px solid rgba(217,56,40,0.3);
  }
  .f-url {
    flex: 1; padding: 10px 12px; background: transparent; border: none;
    color: var(--red-dark); font-family: var(--font-body); font-size: 12px; outline: none; width: 100%;
  }
  .btn-copy {
    background: var(--red); border: none; color: #fff; padding: 0 18px;
    cursor: pointer; font-family: var(--font-body); font-size: 12px; transition: .2s;
  }
  .btn-copy:hover { background: var(--orange); }

  .remove-btn {
    position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.05);
    border: none; border-radius: 50%; width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    color: #999; cursor: pointer; transition: .2s; font-size: 16px;
  }
  .remove-btn:hover { background: rgba(255,59,48,0.1); color: #ff3b30; }

  /* ============ TOAST ============ */
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translate(-50%, 20px);
    background: #222; color: #fff; padding: 12px 24px; border-radius: 10px;
    font-family: var(--font-body); font-size: 13px; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.2); opacity: 0;
    pointer-events: none; transition: .3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 100;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 500px) {
    :root { --cut: 18px; }
    .content-scroll { padding: 25px 15px; }
    .file-item { flex-direction: column; align-items: flex-start; }
    .thumb { width: 100%; height: 160px; margin-bottom: 10px; }
    .remove-btn { top: 10px; right: 10px; background: rgba(255,255,255,0.8); }
    .status-banner { flex-direction: column; gap: 12px; text-align: center; }
    .btn-copy-all { width: 100%; }
  }
</style>
</head>
<body>

<div class="glow" aria-hidden="true"></div>

<div class="glass-container">
  <div class="content-scroll">
    
    <div class="header">
      <img class="logo" src="https://azerst-image-vn.vercel.app/images/AVATA_AZERST.png" alt="Azerst" />
      <h1>AZERST UPLOAD</h1>
      <p class="desc">Tải ảnh nhanh, nhận link trực tiếp</p>
    </div>

    <div class="input-group">
      <label class="input-label" for="imageName">Tên ảnh muốn lưu (Không bắt buộc)</label>
      <input id="imageName" class="name-input" type="text" maxlength="50" placeholder="Ví dụ: Anh_Dai_Dien" autocomplete="off" />
    </div>

    <label class="upload-zone" for="file" id="dropZone">
      <svg class="upload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
      </svg>
      <h3>Chọn hoặc kéo thả ảnh</h3>
      <p>Hỗ trợ PNG, JPG, WEBP, GIF (Tối đa 10GB)</p>
    </label>
    <input id="file" type="file" multiple accept="image/png,image/jpeg,image/webp,image/gif,image/avif" />

    <!-- KHU VỰC HIỂN THỊ LINK -->
    <div id="resultSection" class="result-section">
      <div class="status-banner">
        <span id="globalStatus">Đang khởi tạo...</span>
        <button class="btn-copy-all" id="btnCopyAll" disabled>COPY TẤT CẢ</button>
      </div>
      <div id="filesList" style="display: flex; flex-direction: column; gap: 12px;"></div>
    </div>

  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { upload } from "https://esm.sh/@vercel/blob@2.8.0/client";

const IMAGE_SERVER = "https://azerst-image-vn.vercel.app";
const MAX_SIZE = 10 * 1024 * 1024 * 1024;
const ALLOWED = ["image/png", "image/jpeg", "image/webp", "image/gif", "image/avif"];

const fileInput = document.getElementById("file");
const nameInput = document.getElementById("imageName");
const dropZone = document.getElementById("dropZone");
const resultSection = document.getElementById("resultSection");
const filesList = document.getElementById("filesList");
const globalStatus = document.getElementById("globalStatus");
const btnCopyAll = document.getElementById("btnCopyAll");
const toast = document.getElementById("toast");

let uploads = [];
let idCounter = 0;
let isUploading = false;

// Hàm tiện ích
const randomName = () => Array.from(crypto.getRandomValues(new Uint8Array(8)), v => "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"[v % 62]).join("");
const getExt = (t) => ({"image/png":"png","image/jpeg":"jpg","image/webp":"webp","image/gif":"gif","image/avif":"avif"})[t];
const cleanName = (v) => v.trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g,"d").replace(/Đ/g,"D").replace(/\s+/g,"_").replace(/[^A-Za-z0-9_-]/g, "");
const delay = (ms) => new Promise(res => setTimeout(res, ms));

const showToast = (msg) => {
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2500);
};

const copyText = async (text) => {
  try { await navigator.clipboard.writeText(text); return true; } 
  catch { 
    try {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); return true;
    } catch { return false; }
  }
};

// Tạo giao diện thẻ ảnh
function createItem(file, filename) {
  const id = ++idCounter;
  const thumbURL = URL.createObjectURL(file);
  const div = document.createElement("div");
  div.className = "file-item";
  div.dataset.id = id;
  div.innerHTML = `
    <div class="thumb"><img src="${thumbURL}" alt=""></div>
    <div class="info">
      <div class="f-name" title="${filename}">${filename}</div>
      <div class="f-status" id="st-${id}">
        <span>Đang chờ...</span>
        <button class="btn-retry" data-retry="${id}">Thử lại</button>
      </div>
      <div class="url-box" id="box-${id}">
        <div class="url-group">
          <input class="f-url" id="url-${id}" readonly>
          <button class="btn-copy" data-copy="${id}">COPY</button>
        </div>
      </div>
    </div>
    <button class="remove-btn" data-remove="${id}">×</button>
  `;
  return { div, id };
}

function updateUI() {
  const total = uploads.length;
  if (total === 0) { resultSection.style.display = "none"; return; }
  
  const success = uploads.filter(u => u.status === "success").length;
  const error = uploads.filter(u => u.status === "error").length;
  const pending = uploads.filter(u => u.status === "pending" || u.status === "uploading").length;

  globalStatus.textContent = `Thành công: ${success} | Lỗi: ${error} | Đang chờ: ${pending}`;
  btnCopyAll.disabled = success === 0;
}

async function uploadSingle(file, filename, id) {
  const stEl = document.getElementById(`st-${id}`);
  const boxEl = document.getElementById(`box-${id}`);
  const urlEl = document.getElementById(`url-${id}`);
  const retryBtn = stEl.querySelector('.btn-retry');
  
  stEl.className = "f-status";
  stEl.querySelector('span').textContent = "Đang tải lên...";
  retryBtn.style.display = "none";
  
  const entry = uploads.find(u => u.id === id);
  entry.status = "uploading";
  updateUI();

  try {
    await upload(`images/${filename}`, file, {
      access: "public",
      handleUploadUrl: IMAGE_SERVER + "/api/upload",
      multipart: true,
    });

    const finalURL = `${IMAGE_SERVER}/images/${encodeURIComponent(filename)}`;
    
    stEl.className = "f-status ok";
    stEl.querySelector('span').textContent = "Tải lên thành công";
    boxEl.style.display = "block";
    urlEl.value = finalURL;

    entry.url = finalURL; 
    entry.status = "success";

  } catch (err) {
    console.error(`Lỗi up ảnh ${filename}:`, err);
    stEl.className = "f-status err";
    stEl.querySelector('span').textContent = "Lỗi kết nối mạng";
    retryBtn.style.display = "inline-block";
    stEl.closest(".file-item").classList.add("error-item");
    entry.status = "error";
  }
  
  updateUI();
}

async function processQueue() {
  if (isUploading) return;
  isUploading = true;

  const pendingItems = uploads.filter(u => u.status === "pending");

  for (let i = 0; i < pendingItems.length; i++) {
    const item = pendingItems[i];
    if (!uploads.find(u => u.id === item.id)) continue;

    await uploadSingle(item.file, item.filename, item.id);
    
    // Nghỉ 1.5 giây trước khi tải ảnh tiếp theo để tránh nghẽn mạng
    if (i < pendingItems.length - 1) {
      await delay(1500);
    }
  }

  isUploading = false;
}

function handleFiles(files) {
  const validFiles = Array.from(files);
  if (!validFiles.length) return;

  const baseName = cleanName(nameInput.value);
  fileInput.value = "";

  for (let i = 0; i < validFiles.length; i++) {
    const f = validFiles[i];
    if (!ALLOWED.includes(f.type) || f.size > MAX_SIZE) {
      showToast(`File ${f.name} không hợp lệ hoặc quá dung lượng!`);
      continue;
    }

    let name = baseName ? (validFiles.length > 1 ? `${baseName}_${i+1}` : baseName) : randomName();
    const filename = `${name}.${getExt(f.type)}`;

    const { div, id } = createItem(f, filename);
    filesList.appendChild(div);
    
    uploads.push({ id, file: f, filename, url: null, status: "pending" });
  }

  resultSection.style.display = "flex";
  updateUI();
  processQueue();
}

// Events
fileInput.addEventListener("change", () => handleFiles(fileInput.files));
dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("dragover"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
dropZone.addEventListener("drop", e => { e.preventDefault(); dropZone.classList.remove("dragover"); handleFiles(e.dataTransfer.files); });

// Xử lý tương tác trong danh sách
filesList.addEventListener("click", async (e) => {
  const copyBtn = e.target.closest("[data-copy]");
  const removeBtn = e.target.closest("[data-remove]");
  const retryBtn = e.target.closest("[data-retry]");

  if (copyBtn) {
    const id = copyBtn.dataset.copy;
    const entry = uploads.find(u => u.id == id);
    if (entry && entry.url) {
      const ok = await copyText(entry.url);
      if (ok) showToast("Đã sao chép link!");
    }
  }

  if (removeBtn) {
    const id = Number(removeBtn.dataset.remove);
    removeBtn.closest(".file-item").remove();
    uploads = uploads.filter(u => u.id !== id);
    updateUI();
  }

  if (retryBtn) {
    const id = Number(retryBtn.dataset.retry);
    const entry = uploads.find(u => u.id === id);
    if (entry) {
      entry.status = "pending";
      retryBtn.closest(".file-item").classList.remove("error-item");
      processQueue();
    }
  }
});

// Copy tất cả
btnCopyAll.addEventListener("click", async () => {
  const urls = uploads.filter(u => u.status === "success" && u.url).map(u => u.url);
  if (urls.length === 0) return;
  const ok = await copyText(urls.join("\n"));
  if (ok) showToast(`Đã sao chép ${urls.length} link!`);
});
</script>

</body>
</html>
