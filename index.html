<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AZERST - CÔNG CỤ CHÈN ẢNH TẠO LINK URL</title>

<link rel="icon"
href="https://Azerst-Image-VN.vercel.app/images/3rYKxqbI.png">

<style>

@font-face{
    font-family:"GFF-Latin-Bold";
    src:
    url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff2")
    format("woff2"),
    url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff")
    format("woff");
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:"GFF-Latin-Bold",Arial,sans-serif;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow-x:hidden;

    background:
        radial-gradient(circle at 20% 20%,#5934ff55,transparent 35%),
        radial-gradient(circle at 80% 80%,#ff2d9b44,transparent 35%),
        linear-gradient(135deg,#070014,#13052b,#05000e);
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background-image:
        radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 1px);

    background-size:70px 70px;
    opacity:.18;
}

.card{
    width:100%;
    max-width:650px;

    padding:30px 22px;

    border:1px solid rgba(255,255,255,.16);
    border-radius:28px;

    background:rgba(15,10,35,.72);
    backdrop-filter:blur(22px);

    box-shadow:
        0 25px 80px rgba(0,0,0,.55),
        0 0 60px rgba(130,70,255,.15);
}

.logo{
    width:90px;
    height:90px;
    object-fit:cover;
    border-radius:22px;
    display:block;
    margin:0 auto 18px;

    box-shadow:
        0 0 30px rgba(140,80,255,.5);
}

h1{
    text-align:center;
    font-size:25px;
    line-height:1.3;
    margin-bottom:12px;
}

.desc{
    text-align:center;
    color:#d8d1e8;
    font-family:Arial,sans-serif;
    font-size:14px;
    line-height:1.6;
    margin-bottom:25px;
}

.drop{
    border:2px dashed rgba(255,255,255,.25);
    border-radius:20px;
    padding:35px 15px;
    text-align:center;
    cursor:pointer;
    transition:.25s;
}

.drop:hover{
    border-color:#9c6cff;
    background:rgba(140,80,255,.08);
}

.drop strong{
    display:block;
    font-size:18px;
    margin-bottom:8px;
}

.drop span{
    color:#aaa2bd;
    font-family:Arial,sans-serif;
    font-size:13px;
}

input{
    display:none;
}

.info{
    display:none;
    margin-top:20px;
    padding:16px;

    border-radius:16px;
    background:rgba(255,255,255,.06);

    font-family:Arial,sans-serif;
    font-size:14px;
    line-height:1.8;
}

.progress{
    display:none;
    margin-top:18px;
}

.progress-bar{
    width:100%;
    height:10px;
    overflow:hidden;
    border-radius:20px;
    background:rgba(255,255,255,.1);
}

.progress-fill{
    width:0%;
    height:100%;
    transition:width:.2s;
    background:linear-gradient(90deg,#7b4dff,#ff42b0);
}

.status{
    text-align:center;
    margin-top:10px;
    font-family:Arial,sans-serif;
    font-size:13px;
    color:#ddd;
}

.result{
    display:none;
    margin-top:20px;
}

.url{
    width:100%;
    padding:14px;
    border:0;
    outline:0;
    border-radius:14px;

    background:rgba(0,0,0,.35);
    color:#fff;

    font-family:Arial,sans-serif;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:12px;
}

button{
    border:0;
    padding:13px;
    border-radius:13px;

    color:white;
    cursor:pointer;

    font-family:"GFF-Latin-Bold",Arial,sans-serif;

    background:linear-gradient(135deg,#754cff,#d43cff);
}

button:hover{
    filter:brightness(1.15);
}

.error{
    display:none;
    margin-top:15px;
    padding:14px;

    border-radius:14px;

    background:rgba(255,40,80,.12);
    border:1px solid rgba(255,80,100,.3);

    color:#ff9aaa;

    font-family:Arial,sans-serif;
    font-size:14px;
}

.footer{
    margin-top:22px;
    text-align:center;

    color:#837b94;

    font-family:Arial,sans-serif;
    font-size:11px;
}

@media(max-width:500px){

    .card{
        padding:24px 16px;
    }

    h1{
        font-size:21px;
    }

    .buttons{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="card">

<img
class="logo"
src="https://Azerst-Image-VN.vercel.app/images/3rYKxqbI.png"
alt="Azerst">

<h1>
AZERST - CÔNG CỤ CHÈN ẢNH TẠO LINK URL
</h1>

<div class="desc">
Công cụ chèn ảnh và tạo link URL trực tiếp nhanh chóng từ Azerst.
Hỗ trợ Android, iPhone và máy tính.
</div>

<label class="drop" for="file">

<strong>📸 Chọn ảnh để tải lên</strong>

<span>
PNG • JPG • JPEG • WEBP • GIF • AVIF
<br>
Dung lượng tối đa hiển thị: 64 GB
</span>

</label>

<input
id="file"
type="file"
accept="image/png,image/jpeg,image/webp,image/gif,image/avif">

<div id="info" class="info"></div>

<div id="progress" class="progress">

<div class="progress-bar">
<div id="progressFill" class="progress-fill"></div>
</div>

<div id="status" class="status">
Đang chuẩn bị...
</div>

</div>

<div id="error" class="error"></div>

<div id="result" class="result">

<input
id="url"
class="url"
readonly>

<div class="buttons">

<button id="copy">
📋 Sao chép URL
</button>

<button id="open">
🔗 Mở ảnh
</button>

<button id="html">
🧩 Copy HTML
</button>

<button id="new">
🔄 Ảnh mới
</button>

</div>

</div>

<div class="footer">
AZERST IMAGE VN
</div>

</div>

<script type="module">

import { upload } from "https://esm.sh/@vercel/blob@2.8.0/client";

const fileInput =
document.getElementById("file");

const info =
document.getElementById("info");

const progress =
document.getElementById("progress");

const progressFill =
document.getElementById("progressFill");

const status =
document.getElementById("status");

const result =
document.getElementById("result");

const errorBox =
document.getElementById("error");

const urlInput =
document.getElementById("url");

const IMAGE_DOMAIN =
"https://Azerst-Image-VN.vercel.app";

function formatSize(bytes){

    if(bytes < 1024)
        return bytes + " B";

    if(bytes < 1024 * 1024)
        return (bytes / 1024).toFixed(2) + " KB";

    if(bytes < 1024 * 1024 * 1024)
        return (bytes / 1024 / 1024).toFixed(2) + " MB";

    return (bytes / 1024 / 1024 / 1024).toFixed(2) + " GB";
}

function showError(message){

    errorBox.style.display = "block";
    errorBox.textContent = "❌ " + message;
}

function hideError(){

    errorBox.style.display = "none";
    errorBox.textContent = "";
}

fileInput.addEventListener("change", async () => {

    hideError();

    const file =
        fileInput.files?.[0];

    if(!file)
        return;

    const allowed = [
        "image/png",
        "image/jpeg",
        "image/webp",
        "image/gif",
        "image/avif"
    ];

    if(!allowed.includes(file.type)){

        showError(
            "Định dạng ảnh không được hỗ trợ."
        );

        fileInput.value = "";
        return;
    }

    info.style.display = "block";

    info.innerHTML = `
        <b>Tên:</b> ${file.name}<br>
        <b>Dung lượng:</b> ${formatSize(file.size)}<br>
        <b>Định dạng:</b> ${file.type}
    `;

    progress.style.display = "block";
    result.style.display = "none";

    progressFill.style.width = "0%";
    status.textContent = "Đang tải ảnh lên...";

    try{

        const blob =
        await upload(
            file.name,
            file,
            {
                access: "public",

                handleUploadUrl:
                    "/api/upload",

                multipart: true,

                onUploadProgress: (event) => {

                    if(event.percentage){

                        progressFill.style.width =
                            event.percentage + "%";

                        status.textContent =
                            "Đang tải: " +
                            Math.round(event.percentage) +
                            "%";
                    }
                }
            }
        );

        const filename =
            blob.pathname ||
            file.name;

        const finalURL =
            IMAGE_DOMAIN +
            "/images/" +
            encodeURIComponent(filename);

        urlInput.value =
            finalURL;

        progressFill.style.width = "100%";

        status.textContent =
            "✅ Upload thành công!";

        result.style.display = "block";

    }catch(error){

        console.error(error);

        showError(
            error?.message ||
            "Không thể tải ảnh lên Vercel Blob."
        );

        status.textContent =
            "Upload thất bại.";

    }

});

document
.getElementById("copy")
.addEventListener("click", async () => {

    await navigator.clipboard.writeText(
        urlInput.value
    );

    status.textContent =
        "✅ Đã sao chép URL";

});

document
.getElementById("open")
.addEventListener("click", () => {

    if(urlInput.value){

        window.open(
            urlInput.value,
            "_blank"
        );

    }

});

document
.getElementById("html")
.addEventListener("click", async () => {

    const html =
        `<img src="${urlInput.value}" alt="Azerst Image">`;

    await navigator.clipboard.writeText(html);

    status.textContent =
        "✅ Đã sao chép HTML";

});

document
.getElementById("new")
.addEventListener("click", () => {

    fileInput.value = "";

    info.style.display = "none";

    progress.style.display = "none";

    result.style.display = "none";

    hideError();

    progressFill.style.width = "0%";

    status.textContent =
        "Đang chuẩn bị...";

});

</script>

</body>
</html>
