<script>

/* ==================================================
   AZERST CONFIG
================================================== */

const API_URL =
    "/api/upload";


/*
==================================================
  DOMAIN TẠO LINK ẢNH
==================================================
*/

const IMAGE_DOMAIN =
    "https://Azerst-Image-VN.vercel.app";


/*
==================================================
  WEBSITE
==================================================
*/

const WEBSITE_URL =
    "https://azerstimagev1.vercel.app/";


/*
==================================================
  64 GB
==================================================
*/

const MAX_SIZE =
    64 *
    1024 *
    1024 *
    1024;


/* ==================================================
   ELEMENTS
================================================== */

const input =
    document.getElementById(
        "fileInput"
    );


const preview =
    document.getElementById(
        "preview"
    );


const previewSection =
    document.getElementById(
        "previewSection"
    );


const createURLBox =
    document.getElementById(
        "createURLBox"
    );


const createURLBtn =
    document.getElementById(
        "createURLBtn"
    );


const result =
    document.getElementById(
        "result"
    );


const urlInput =
    document.getElementById(
        "urlInput"
    );


const fileName =
    document.getElementById(
        "fileName"
    );


const fileSize =
    document.getElementById(
        "fileSize"
    );


const fileType =
    document.getElementById(
        "fileType"
    );


const message =
    document.getElementById(
        "message"
    );


const copyBtn =
    document.getElementById(
        "copyBtn"
    );


const openBtn =
    document.getElementById(
        "openBtn"
    );


const htmlBtn =
    document.getElementById(
        "htmlBtn"
    );


const newBtn =
    document.getElementById(
        "newBtn"
    );


let selectedFile = null;

let uploadedFilename = "";

let currentURL = "";


/* ==================================================
   FORMAT SIZE
================================================== */

function formatSize(bytes) {

    if (
        bytes <
        1024
    ) {

        return (
            bytes +
            " B"
        );

    }


    if (
        bytes <
        1024 *
        1024
    ) {

        return (
            bytes /
            1024
        ).toFixed(1) +
        " KB";

    }


    if (
        bytes <
        1024 *
        1024 *
        1024
    ) {

        return (
            bytes /
            1024 /
            1024
        ).toFixed(2) +
        " MB";

    }


    return (
        bytes /
        1024 /
        1024 /
        1024
    ).toFixed(2) +
    " GB";

}


/* ==================================================
   MESSAGE
================================================== */

function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message " +
        type;

}


/* ==================================================
   EXTENSION
================================================== */

function getExtension(file) {

    let ext =
        file.name
            .split(".")
            .pop()
            .toLowerCase();


    if (
        ext === "jpeg"
    ) {

        ext = "jpg";

    }


    return ext;

}


/* ==================================================
   UPLOAD
================================================== */

async function uploadImage(
    file
) {

    const ext =
        getExtension(
            file
        );


    /*
    Tên gửi lên API
    */

    const formData =
        new FormData();


    formData.append(
        "file",
        file,
        "upload." + ext
    );


    const response =
        await fetch(
            API_URL,
            {
                method:
                    "POST",

                body:
                    formData
            }
        );


    let data;


    try {

        data =
            await response.json();

    } catch {

        throw new Error(
            "API không trả về JSON hợp lệ."
        );

    }


    if (
        !response.ok ||
        !data ||
        !data.success ||
        !data.filename
    ) {

        throw new Error(
            data?.error ||
            "Upload hình ảnh thất bại."
        );

    }


    uploadedFilename =
        data.filename;


    return uploadedFilename;

}


/* ==================================================
   CHỌN ẢNH
================================================== */

input.addEventListener(
    "change",
    function () {

        const file =
            this.files?.[0];


        if (!file) {

            return;

        }


        selectedFile =
            file;


        uploadedFilename =
            "";


        currentURL =
            "";


        result.style.display =
            "none";


        /* SIZE */

        if (
            file.size >
            MAX_SIZE
        ) {

            showMessage(
                "❌ Hình ảnh vượt quá dung lượng tối đa 64 GB.",
                "error"
            );


            input.value =
                "";


            return;

        }


        /* TYPE */

        const allowed = [

            "image/png",

            "image/jpeg",

            "image/webp",

            "image/gif",

            "image/avif"

        ];


        if (
            !allowed.includes(
                file.type
            )
        ) {

            showMessage(
                "❌ Định dạng hình ảnh không được hỗ trợ.",
                "error"
            );


            input.value =
                "";


            return;

        }


        /* PREVIEW */

        preview.src =
            URL.createObjectURL(
                file
            );


        previewSection.style.display =
            "block";


        /* INFO */

        fileName.textContent =
            file.name;


        fileSize.textContent =
            formatSize(
                file.size
            );


        fileType.textContent =
            file.type;


        /* BUTTON */

        createURLBox.style.display =
            "block";


        createURLBtn.disabled =
            false;


        createURLBtn.textContent =
            "🔗 TẠO URL ẢNH";


        showMessage(
            "✨ Ảnh đã được chọn. Nhấn TẠO URL ẢNH để tạo link.",
            "success"
        );

    }
);


/* ==================================================
   CREATE URL
================================================== */

createURLBtn.addEventListener(
    "click",
    async function () {

        if (!selectedFile) {

            showMessage(
                "❌ Vui lòng chọn hình ảnh trước.",
                "error"
            );

            return;

        }


        try {

            createURLBtn.disabled =
                true;


            createURLBtn.textContent =
                "🔗 ĐANG UPLOAD...";


            if (
                !uploadedFilename
            ) {

                await uploadImage(
                    selectedFile
                );

            }


            if (
                !uploadedFilename
            ) {

                throw new Error(
                    "Không lấy được tên hình ảnh."
                );

            }


            /*
            ======================================
            URL CUỐI CÙNG
            ======================================
            */

            currentURL =
                IMAGE_DOMAIN +
                "/images/" +
                encodeURIComponent(
                    uploadedFilename
                );


            urlInput.value =
                currentURL;


            result.style.display =
                "block";


            createURLBtn.disabled =
                false;


            createURLBtn.textContent =
                "✅ URL ĐÃ ĐƯỢC TẠO";


            showMessage(
                "✅ Link URL ảnh đã được tạo thành công.",
                "success"
            );


            result.scrollIntoView({
                behavior:
                    "smooth",

                block:
                    "center"
            });


        } catch (error) {

            console.error(
                error
            );


            createURLBtn.disabled =
                false;


            createURLBtn.textContent =
                "🔗 TẠO URL ẢNH";


            showMessage(
                "❌ " +
                (
                    error.message ||
                    "Không thể tạo URL."
                ),
                "error"
            );

        }

    }
);


/* ==================================================
   COPY URL
================================================== */

copyBtn.addEventListener(
    "click",
    async function () {

        if (!currentURL) {

            return;

        }


        try {

            await navigator.clipboard.writeText(
                currentURL
            );


            copyBtn.textContent =
                "ĐÃ SAO CHÉP";


            setTimeout(
                () => {

                    copyBtn.textContent =
                        "SAO CHÉP";

                },
                1500
            );


        } catch {

            urlInput.select();

            document.execCommand(
                "copy"
            );

        }

    }
);


/* ==================================================
   OPEN
================================================== */

openBtn.addEventListener(
    "click",
    function () {

        if (!currentURL) {

            return;

        }


        window.open(
            currentURL,
            "_blank"
        );

    }
);


/* ==================================================
   COPY HTML
================================================== */

htmlBtn.addEventListener(
    "click",
    async function () {

        if (!currentURL) {

            return;

        }


        const html =
            `<img src="${currentURL}" alt="Azerst">`;


        try {

            await navigator.clipboard.writeText(
                html
            );


            htmlBtn.textContent =
                "ĐÃ SAO CHÉP";


            setTimeout(
                () => {

                    htmlBtn.textContent =
                        "COPY HTML";

                },
                1500
            );


        } catch {

            alert(
                html
            );

        }

    }
);


/* ==================================================
   NEW IMAGE
================================================== */

newBtn.addEventListener(
    "click",
    function () {

        selectedFile =
            null;


        uploadedFilename =
            "";


        currentURL =
            "";


        input.value =
            "";


        preview.removeAttribute(
            "src"
        );


        previewSection.style.display =
            "none";


        createURLBox.style.display =
            "none";


        result.style.display =
            "none";


        urlInput.value =
            "";


        createURLBtn.disabled =
            false;


        createURLBtn.textContent =
            "🔗 TẠO URL ẢNH";


        message.textContent =
            "";


        message.className =
            "message";


        window.scrollTo({

            top: 0,

            behavior:
                "smooth"

        });

    }
);

</script>

</body>
