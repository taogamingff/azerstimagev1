<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AZERST — Image Upload</title>
<link rel="icon" href="https://azerst-image-vn.vercel.app/images/AVATA_AZERST.png" />

<style>
  :root{
    --red:#d93828;
    --red-dark:#b52a1c;
    --bg-main:#eef2f6;
    --grid-color:rgba(0,0,0,0.07);
    --text-main:#2d3748;
    --text-muted:#718096;
  }

  *,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    min-height:100vh;
    overflow-x:hidden;
  }

  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    background-color:var(--bg-main);
    background-image:
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size:32px 32px;
    background-position:center top;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px 15px;
    -webkit-font-smoothing:antialiased;
  }

  /* ============ KHỐI KÍNH LỎNG ============ */
  .glass-container{
    --cut:28px;
    width:min(600px, 100%);
    max-height:90vh;
    position:relative;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.3) 30%, rgba(255,255,255,0.5) 100%),
      linear-gradient(135deg, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0.7) 100%);
    backdrop-filter:blur(40px) saturate(180%);
    -webkit-backdrop-filter:blur(40px) saturate(180%);
    clip-path:polygon(
      var(--cut) 0, 100% 0,
      100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%,
      0 100%, 0 var(--cut)
    );
    box-shadow:
      0 1.5px 0 rgba(255,255,255,1) inset,
      0 0 60px -20px rgba(255,255,255,0.6) inset,
      0 -1px 0 rgba(255,255,255,0.4) inset,
      0 20px 40px rgba(0,0,0,0.1);
    display:flex;
    flex-direction:column;
    isolation:isolate;
    animation:rise 1s cubic-bezier(.2,.8,.2,1) both;
  }

  /* Viền sáng trên */
  .glass-container::before{
    content:""; position:absolute; top:0; left:8%; right:8%; height:1.5px;
    background:linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.95) 20%, rgba(255,255,255,1) 50%, rgba(255,255,255,0.95) 80%, transparent 100%);
    z-index:6; pointer-events:none; filter:blur(0.3px);
  }

  /* Sheen lỏng chảy */
  .glass-container::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(115deg, transparent 0%, transparent 25%, rgba(255,255,255,0.3) 42%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0.3) 58%, transparent 75%, transparent 100%);
    pointer-events:none; z-index:0; animation:sheen 9s ease-in-out infinite; opacity:0.6;
  }

  @keyframes sheen{
    0%,100%{ transform:translateX(-30%) skewX(-8deg); opacity:0.3; }
    50%    { transform:translateX(30%)  skewX(-8deg); opacity:0.7; }
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(30px) scale(.96); filter:blur(8px); }
    to  { opacity:1; transform:translateY(0) scale(1);      filter:blur(0); }
  }

  /* ============ QUẦNG SÁNG ============ */
  .glow{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(ellipse at 28% 32%, rgba(255,122,92,0.4) 0%, transparent 55%),
      radial-gradient(ellipse at 72% 68%, rgba(217,56,40,0.4) 0%, transparent 55%);
    filter:blur(60px); animation:pulseGlow 5s ease-in-out infinite alternate;
  }

  @keyframes pulseGlow{
    0%  { transform:scale(0.96); opacity:0.5; }
    100%{ transform:scale(1.04); opacity:0.9; }
  }

  /* ============ NỘI DUNG BÊN TRONG ============ */
  .content-scroll {
    padding: 30px 25px;
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Scrollbar cho kính lỏng */
  .content-scroll::-webkit-scrollbar { width: 6px; }
  .content-scroll::-webkit-scrollbar-track { background: transparent; }
  .content-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
  .content-scroll::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.2); }

  .header { text-align: center; }
  .logo {
    width: 70px; height: 70px; margin: 0 auto 15px;
    object-fit: cover; border-radius: 16px;
    box-shadow: 0 8px 25px rgba(217,56,40,0.3);
    transition: transform 0.3s;
  }
  .logo:hover { transform: scale(1.05) rotate(3deg); }

  h1 { color: var(--text-main); font-size: 22px; letter-spacing: 0.5px; margin-bottom: 5px; }
  .desc { color: var(--text-muted); font-size: 13px; }

  /* Ô nhập tên */
  .input-group { display: flex; flex-direction: column; gap: 8px; }
  .input-label { font-size: 13px; font-weight: 600; color: var(--text-main); }
  .name-input {
    width: 100%; padding: 14px 16px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.3);
    color: var(--text-main); font-size: 14px; outline: none; transition: .3s;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
  }
  .name-input::placeholder { color: #a0aec0; }
  .name-input:focus { border-color: var(--red); background: rgba(255,255,255,0.6); box-shadow: 0 0 0 3px rgba(217,56,40,0.15); }

  /* Vùng Upload */
  .upload-zone {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 35px 20px; border: 2px dashed rgba(217,56,40,0.4); border-radius: 16px;
    background: rgba(255,255,255,0.4); cursor: pointer; transition: .3s;
  }
  .upload-zone:hover, .upload-zone.dragover {
    background: rgba(255,255,255,0.7); border-color: var(--red);
    box-shadow: 0 10px 30px rgba(217,56,40,0.15); transform: translateY(-2px);
  }
  .upload-icon { width: 45px; height: 45px; color: var(--red); margin-bottom: 12px; transition: .3s; }
  .upload-zone:hover .upload-icon { transform: translateY(-5px); }
  .upload-zone h3 { color: var(--text-main); font-size: 16px; margin-bottom: 6px; }
  .upload-zone p { color: var(--text-muted); font-size: 12px; }
  #file { display: none; }

  /* Danh sách kết quả */
  .result-section { display: none; flex-direction: column; gap: 12px; }
  
  .status-banner {
    background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.8);
    border-radius: 12px; padding: 12px 16px; display: flex; justify-content: space-between;
    align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.03);
  }
  .status-banner span { font-size: 13px; font-weight: 600; color: var(--text-main); }
  .btn-copy-all {
    background: var(--text-main); color: #fff; border: none; padding: 8px 16px;
    border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: .2s;
  }
  .btn-copy-all:hover { background: var(--red); transform: scale(1.05); }

  /* Thẻ ảnh */
  .file-item {
    --cut: 12px;
    display: flex; gap: 15px; padding: 15px;
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(255,255,255,0.9);
    clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
    position: relative; transition: .3s; animation: slideIn .3s ease;
  }
  .file-item:hover { background: rgba(255,255,255,0.9); box-shadow: 0 8px 25px rgba(0,0,0,0.05); }
  .file-item.error-item { border-color: rgba(217,56,40,0.5); background: rgba(255,240,240,0.8); }

  .thumb { width: 65px; height: 65px; flex-shrink: 0; border-radius: 10px; overflow: hidden; background: #e2e8f0; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }

  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .f-name { font-size: 14px; font-weight: 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
  .f-status { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
  .f-status.ok { color: #2f855a; font-weight: 600; }
  .f-status.err { color: var(--red); font-weight: 600; }

  /* Nút thử lại */
  .btn-retry {
    background: var(--red); color: #fff; border: none; padding: 4px 10px;
    border-radius: 6px; font-size: 11px; cursor: pointer; display: none;
  }
  .btn-retry:hover { background: var(--red-dark); }

  /* Thanh URL */
  .url-box { display: none; margin-top: 10px; width: 100%; }
  .url-group {
    display: flex; background: rgba(255,255,255,0.8); border-radius: 8px; overflow: hidden;
    border: 1px solid rgba(217,56,40,0.2);
  }
  .f-url {
    flex: 1; padding: 10px 12px; background: transparent; border: none;
    color: var(--text-main); font-size: 12px; outline: none; width: 100%;
  }
  .btn-copy {
    background: var(--text-main); border: none; color: #fff; padding: 0 16px;
    cursor: pointer; font-size: 12px; font-weight: 600; transition: .2s;
  }
  .btn-copy:hover { background: var(--red); }

  .remove-btn {
    position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.05);
    border: none; border-radius: 50%; width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    color: #a0aec0; cursor: pointer; transition: .2s;
  }
  .remove-btn:hover { background: rgba(217,56,40,0.1); color: var(--red); }

  /* Toast */
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translate(-50%, 20px);
    background: #2d3748; color: #fff; padding: 12px 24px; border-radius: 10px;
    font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); opacity: 0;
    pointer-events: none; transition: .3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 100;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 500px) {
    .glass-container { --cut: 22px; }
    .content-scroll { padding: 20px 15px; }
    .file-item { flex-direction: column; align-items: center; text-align: center; }
    .thumb { width: 100%; height: 140px; margin-bottom: 10px; }
    .remove-btn { top: 10px; right: 10px; }
    .status-banner { flex-direction: column; gap: 10px; }
    .btn-copy-all { width: 100%; }
  }
</style>
</head>
<body>

<div class="glow" aria-hidden="true"></div>

<div class="glass-container">
  <div class="content-scroll">
    
    <div class="header">
      <img class="logo" src="https://azerst-image-vn.vercel.app/images/AVATA_AZERST.png" alt="Azerst" />
      <h1>AZERST UPLOAD</h1>
      <p class="desc">Tải ảnh nhanh, nhận link trực tiếp</p>
    </div>

    <div class="input-group">
      <label class="input-label" for="imageName">Tên ảnh muốn lưu (Không bắt buộc)</label>
      <input id="imageName" class="name-input" type="text" maxlength="50" placeholder="Ví dụ: Anh_Dai_Dien" autocomplete="off" />
    </div>

    <label class="upload-zone" for="file" id="dropZone">
      <svg class="upload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
      </svg>
      <h3>Chọn hoặc kéo thả ảnh</h3>
      <p>Hỗ trợ PNG, JPG, WEBP, GIF (Tối đa 10GB)</p>
    </label>
    <input id="file" type="file" multiple accept="image/png,image/jpeg,image/webp,image/gif,image/avif" />

    <div id="resultSection" class="result-section">
      <div class="status-banner">
        <span id="globalStatus">Đang chờ...</span>
        <button class="btn-copy-all" id="btnCopyAll">Copy Tất Cả</button>
      </div>
      <div id="filesList" style="display: flex; flex-direction: column; gap: 10px;"></div>
    </div>

  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { upload } from "https://esm.sh/@vercel/blob@2.8.0/client";

const IMAGE_SERVER = "https://azerst-image-vn.vercel.app";
const MAX_SIZE = 10 * 1024 * 1024 * 1024;
const ALLOWED = ["image/png", "image/jpeg", "image/webp", "image/gif", "image/avif"];

const fileInput = document.getElementById("file");
const nameInput = document.getElementById("imageName");
const dropZone = document.getElementById("dropZone");
const resultSection = document.getElementById("resultSection");
const filesList = document.getElementById("filesList");
const globalStatus = document.getElementById("globalStatus");
const btnCopyAll = document.getElementById("btnCopyAll");
const toast = document.getElementById("toast");

let uploads = [];
let idCounter = 0;
let isUploading = false; // Cờ chặn upload chồng chéo

// Hàm tiện ích
const formatSize = (b) => b < 1048576 ? (b/1024).toFixed(1)+" KB" : (b/1048576).toFixed(1)+" MB";
const randomName = () => Array.from(crypto.getRandomValues(new Uint8Array(8)), v => "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"[v % 62]).join("");
const getExt = (t) => ({"image/png":"png","image/jpeg":"jpg","image/webp":"webp","image/gif":"gif","image/avif":"avif"})[t];
const cleanName = (v) => v.trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g,"d").replace(/Đ/g,"D").replace(/\s+/g,"_").replace(/[^A-Za-z0-9_-]/g, "");
const delay = (ms) => new Promise(res => setTimeout(res, ms));

const showToast = (msg) => {
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2500);
};

const copyText = async (text) => {
  try { await navigator.clipboard.writeText(text); return true; } 
  catch { 
    try {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); return true;
    } catch { return false; }
  }
};

// Tạo giao diện thẻ ảnh
function createItem(file, filename) {
  const id = ++idCounter;
  const thumbURL = URL.createObjectURL(file);
  const div = document.createElement("div");
  div.className = "file-item";
  div.dataset.id = id;
  div.innerHTML = `
    <div class="thumb"><img src="${thumbURL}" alt=""></div>
    <div class="info">
      <div class="f-name" title="${filename}">${filename}</div>
      <div class="f-status" id="st-${id}">
        <span>Đang chờ...</span>
        <button class="btn-retry" data-retry="${id}" style="display:none;">Thử lại</button>
      </div>
      <div class="url-box" id="box-${id}">
        <div class="url-group">
          <input class="f-url" id="url-${id}" readonly>
          <button class="btn-copy" data-copy="${id}">COPY</button>
        </div>
      </div>
    </div>
    <button class="remove-btn" data-remove="${id}">×</button>
  `;
  return { div, id };
}

// Cập nhật trạng thái tổng
function updateUI() {
  const total = uploads.length;
  if (total === 0) { resultSection.style.display = "none"; return; }
  
  const success = uploads.filter(u => u.status === "success").length;
  const error = uploads.filter(u => u.status === "error").length;
  const pending = uploads.filter(u => u.status === "pending" || u.status === "uploading").length;

  globalStatus.textContent = `Thành công: ${success} | Lỗi: ${error} | Đang chờ: ${pending}`;
  if (success > 0) btnCopyAll.disabled = false; else btnCopyAll.disabled = true;
}

// Hàm tải 1 ảnh
async function uploadSingle(file, filename, id) {
  const stEl = document.getElementById(`st-${id}`);
  const boxEl = document.getElementById(`box-${id}`);
  const urlEl = document.getElementById(`url-${id}`);
  const retryBtn = stEl.querySelector('.btn-retry');
  
  stEl.className = "f-status";
  stEl.querySelector('span').textContent = "Đang tải lên...";
  retryBtn.style.display = "none";
  
  const entry = uploads.find(u => u.id === id);
  entry.status = "uploading";
  updateUI();

  try {
    await upload(`images/${filename}`, file, {
      access: "public",
      handleUploadUrl: IMAGE_SERVER + "/api/upload",
      multipart: true,
    });

    const finalURL = `${IMAGE_SERVER}/images/${encodeURIComponent(filename)}`;
    
    stEl.className = "f-status ok";
    stEl.querySelector('span').textContent = "Tải lên thành công";
    boxEl.style.display = "block";
    urlEl.value = finalURL;

    entry.url = finalURL; 
    entry.status = "success";

  } catch (err) {
    console.error(`Lỗi up ảnh ${filename}:`, err);
    stEl.className = "f-status err";
    stEl.querySelector('span').textContent = "Lỗi kết nối";
    retryBtn.style.display = "inline-block";
    stEl.closest(".file-item").classList.add("error-item");
    entry.status = "error";
  }
  
  updateUI();
}

// Hàm xử lý hàng đợi (Queue)
async function processQueue() {
  if (isUploading) return;
  isUploading = true;

  // Lấy danh sách ảnh đang chờ
  const pendingItems = uploads.filter(u => u.status === "pending");

  for (let i = 0; i < pendingItems.length; i++) {
    const item = pendingItems[i];
    // Kiểm tra nếu người dùng đã xóa ảnh này thì bỏ qua
    if (!uploads.find(u => u.id === item.id)) continue;

    await uploadSingle(item.file, item.filename, item.id);
    
    // Đợi 1.5 giây trước khi up ảnh tiếp theo để tránh nghẽn mạng
    if (i < pendingItems.length - 1) {
      await delay(1500);
    }
  }

  isUploading = false;
}

// Xử lý khi chọn file
function handleFiles(files) {
  const validFiles = Array.from(files);
  if (!validFiles.length) return;

  const baseName = cleanName(nameInput.value);
  fileInput.value = ""; // Reset

  for (let i = 0; i < validFiles.length; i++) {
    const f = validFiles[i];
    if (!ALLOWED.includes(f.type) || f.size > MAX_SIZE) {
      showToast(`File ${f.name} không hợp lệ!`);
      continue;
    }

    let name = baseName ? (validFiles.length > 1 ? `${baseName}_${i+1}` : baseName) : randomName();
    const filename = `${name}.${getExt(f.type)}`;

    const { div, id } = createItem(f, filename);
    filesList.appendChild(div);
    
    uploads.push({ id, file: f, filename, url: null, status: "pending" });
  }

  resultSection.style.display = "flex";
  updateUI();
  processQueue(); // Kích hoạt hàng đợi
}

// Events
fileInput.addEventListener("change", () => handleFiles(fileInput.files));
dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("dragover"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
dropZone.addEventListener("drop", e => { e.preventDefault(); dropZone.classList.remove("dragover"); handleFiles(e.dataTransfer.files); });

// Xử lý Click (Copy, Remove, Retry)
filesList.addEventListener("click", async (e) => {
  const copyBtn = e.target.closest("[data-copy]");
  const removeBtn = e.target.closest("[data-remove]");
  const retryBtn = e.target.closest("[data-retry]");

  // Nút Copy
  if (copyBtn) {
    const id = copyBtn.dataset.copy;
    const entry = uploads.find(u => u.id == id);
    if (entry && entry.url) {
      const ok = await copyText(entry.url);
      if (ok) showToast("Đã sao chép link!");
    }
  }

  // Nút Xóa
  if (removeBtn) {
    const id = Number(removeBtn.dataset.remove);
    removeBtn.closest(".file-item").remove();
    uploads = uploads.filter(u => u.id !== id);
    updateUI();
  }

  // Nút Thử lại (Retry)
  if (retryBtn) {
    const id = Number(retryBtn.dataset.retry);
    const entry = uploads.find(u => u.id === id);
    if (entry) {
      entry.status = "pending";
      retryBtn.closest(".file-item").classList.remove("error-item");
      processQueue();
    }
  }
});

// Copy tất cả
btnCopyAll.addEventListener("click", async () => {
  const urls = uploads.filter(u => u.status === "success" && u.url).map(u => u.url);
  if (urls.length === 0) return;
  const ok = await copyText(urls.join("\n"));
  if (ok) showToast(`Đã sao chép ${urls.length} link!`);
});
</script>

</body>
</html>
