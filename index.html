<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AZERST — Image Upload</title>
<link rel="icon" href="https://azerst-image-vn.vercel.app/images/AVATA_AZERST.png" />

<style>
  /* ================= FONT GFF ================= */
  @font-face{
    font-family:"GFF-Latin-Bold";
    src: url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff2") format("woff2"),
         url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff") format("woff");
    font-display:swap;
  }
  @font-face{
    font-family:"GFF-Latin-Black";
    src: url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Black.woff2") format("woff2"),
         url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Black.woff") format("woff");
    font-display:swap;
  }

  :root{
    --font-heading:"GFF-Latin-Black", "GFF-Latin-Bold", system-ui, sans-serif;
    --font-body:"GFF-Latin-Bold", system-ui, sans-serif;
    
    --red:#d93828;
    --orange:#ff5e3a;
    --bg-main:#eef2f6;
    --grid-color:rgba(0,0,0,0.05);
    
    /* Liquid Glass Variables */
    --glass-bg: rgba(255, 255, 255, 0.45);
    --glass-border: rgba(255, 255, 255, 0.8);
    --cut: 24px;
    --cut-sm: 10px;
  }

  *,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    min-height:100vh;
    overflow-x:hidden;
  }

  body{
    font-family: var(--font-body);
    background-color:var(--bg-main);
    background-image:
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size:30px 30px;
    background-position:center top;
    display:flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 15px;
    -webkit-font-smoothing:antialiased;
  }

  /* ============ QUẦNG SÁNG NỀN ============ */
  .glow{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(255,94,58,0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 70%, rgba(217,56,40,0.15) 0%, transparent 50%);
    filter:blur(50px); animation:pulseGlow 6s ease-in-out infinite alternate;
  }
  @keyframes pulseGlow{
    0%  { transform:scale(0.95); opacity:0.6; }
    100%{ transform:scale(1.05); opacity:1; }
  }

  /* ============ KHUNG KÍNH LỎNG CHÍNH ============ */
  .glass-wrapper {
    width:min(600px, 100%);
    position: relative;
    display: flex;
    flex-direction: column;
    clip-path: polygon(
      var(--cut) 0, 100% 0,
      100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%,
      0 100%, 0 var(--cut)
    );
    animation: rise 0.8s cubic-bezier(.2,.8,.2,1) both;
    margin-bottom: 20px;
  }

  /* Khung nền Liquid Glass */
  .glass-inner {
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(circle at 100% 0%, rgba(217,56,40,0.2) 0%, transparent 40%),
      radial-gradient(circle at 0% 100%, rgba(255,94,58,0.15) 0%, transparent 40%),
      var(--glass-bg);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    z-index: 0;
    border: 2px solid var(--glass-border);
    pointer-events: none;
  }
  
  .glass-inner::after {
    content:""; position:absolute; inset:0;
    background:linear-gradient(115deg, transparent 0%, transparent 25%, rgba(255,255,255,0.4) 42%, rgba(255,255,255,0.7) 50%, rgba(255,255,255,0.4) 58%, transparent 75%, transparent 100%);
    animation:sheen 8s ease-in-out infinite; opacity:0.6;
  }
  @keyframes sheen{
    0%,100%{ transform:translateX(-40%) skewX(-10deg); opacity:0.3; }
    50%    { transform:translateX(40%)  skewX(-10deg); opacity:0.7; }
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(20px); filter:blur(5px); }
    to  { opacity:1; transform:translateY(0);    filter:blur(0); }
  }

  .content-area {
    position: relative;
    z-index: 1;
    padding: 30px 25px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ============ HEADER ============ */
  .header { text-align: center; }
  .logo {
    width: 65px; height: 65px; margin: 0 auto 12px;
    object-fit: cover; border-radius: 16px;
    box-shadow: 0 6px 20px rgba(217,56,40,0.25);
    transition: transform 0.3s;
  }
  .logo:hover { transform: scale(1.05) rotate(3deg); }
  
  h1 { 
    font-family: var(--font-heading);
    font-size: 24px; 
    letter-spacing: 1px; 
    margin-bottom: 4px;
    text-transform: uppercase;
    background: linear-gradient(90deg, var(--red), var(--orange), var(--red));
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: textShine 3s linear infinite;
  }
  @keyframes textShine {
    to { background-position: 200% center; }
  }
  .desc { color: #555; font-size: 12px; }

  /* ============ NHẬP TÊN ============ */
  .input-group { display: flex; flex-direction: column; gap: 6px; }
  .input-label { font-size: 13px; color: #333; }
  .name-input {
    width: 100%; padding: 12px 15px; 
    clip-path: polygon(var(--cut-sm) 0, 100% 0, 100% calc(100% - var(--cut-sm)), calc(100% - var(--cut-sm)) 100%, 0 100%, 0 var(--cut-sm));
    border: 1.5px solid var(--glass-border); 
    background: rgba(255,255,255,0.5);
    color: #222; font-family: var(--font-body); font-size: 14px; outline: none; transition: .3s;
  }
  .name-input::placeholder { color: #888; }
  .name-input:focus { 
    border-color: var(--orange); 
    background: #fff; 
    box-shadow: 0 0 0 3px rgba(255,94,58,0.15); 
  }

  /* ============ VÙNG UPLOAD MỚI (VIỀN ĐẸP HƠN) ============ */
  .upload-zone {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 30px 15px; 
    clip-path: polygon(var(--cut-sm) 0, 100% 0, 100% calc(100% - var(--cut-sm)), calc(100% - var(--cut-sm)) 100%, 0 100%, 0 var(--cut-sm));
    background: rgba(255,255,255,0.2); 
    cursor: pointer; transition: .3s;
    position: relative;
  }
  
  /* Tạo viền phát sáng bao quanh */
  .upload-zone::before {
    content: "";
    position: absolute;
    inset: 0;
    clip-path: inherit;
    border: 2px dashed rgba(255, 94, 58, 0.6);
    transition: .3s;
    pointer-events: none;
  }
  
  .upload-zone:hover::before, .upload-zone.dragover::before {
    border-color: var(--red);
    border-width: 2.5px;
    box-shadow: inset 0 0 25px rgba(217,56,40,0.2);
    animation: dashAnim 10s linear infinite;
  }
  
  .upload-zone:hover, .upload-zone.dragover {
    background: rgba(255, 94, 58, 0.08); 
    transform: translateY(-2px);
  }

  @keyframes dashAnim {
    to { stroke-dashoffset: 100; }
  }

  .upload-zone h3 { color: #222; font-size: 15px; margin-bottom: 6px; }
  .upload-zone p { color: #666; font-size: 12px; }
  #file { display: none; }

  /* ============ THANH LOAD TỔNG (GLOBAL PROGRESS) ============ */
  .global-progress-container {
    width: 100%;
    height: 6px;
    background: rgba(0,0,0,0.1);
    border-radius: 3px;
    overflow: hidden;
    display: none; /* Ẩn mặc định, chỉ hiện khi up */
    margin-top: 10px;
  }
  .global-progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--red), var(--orange));
    border-radius: 3px;
    transition: width 0.3s ease;
  }

  /* ============ KHU VỰC KẾT QUẢ ============ */
  .result-section { display: none; flex-direction: column; gap: 15px; }
  
  .btn-copy-all {
    width: 100%;
    background: linear-gradient(135deg, var(--red), var(--orange)); 
    color: #fff; border: none; padding: 14px;
    clip-path: polygon(var(--cut-sm) 0, 100% 0, 100% calc(100% - var(--cut-sm)), calc(100% - var(--cut-sm)) 100%, 0 100%, 0 var(--cut-sm));
    font-family: var(--font-body); font-size: 15px; letter-spacing: 1px;
    cursor: pointer; transition: .3s;
    box-shadow: 0 6px 15px rgba(217,56,40,0.3);
  }
  .btn-copy-all:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); }
  .btn-copy-all:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

  /* Thẻ ảnh kết quả */
  .file-item {
    --item-cut: 14px;
    display: flex; flex-direction: column; padding: 15px; gap: 12px;
    background: 
      radial-gradient(circle at 100% 0%, rgba(217,56,40,0.15) 0%, transparent 50%),
      rgba(255,255,255,0.4);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1.5px solid rgba(255,255,255,0.9);
    clip-path: polygon(0 0, calc(100% - var(--item-cut)) 0, 100% var(--item-cut), 100% 100%, var(--item-cut) 100%, 0 calc(100% - var(--item-cut)));
    position: relative; transition: .3s; animation: slideIn .3s ease;
  }
  .file-item:hover { background: radial-gradient(circle at 100% 0%, rgba(217,56,40,0.25) 0%, transparent 50%), rgba(255,255,255,0.6); }
  .file-item.error-item { 
    background: radial-gradient(circle at 100% 0%, rgba(255,0,0,0.15) 0%, transparent 50%), rgba(255,245,245,0.6);
    border-color: rgba(255,150,150,0.8);
  }

  .file-top { display: flex; gap: 12px; align-items: center; }
  .thumb { width: 50px; height: 50px; flex-shrink: 0; border-radius: 8px; overflow: hidden; background: #eee; border: 1px solid rgba(0,0,0,0.1); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  
  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .f-name { font-size: 14px; color: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
  .f-status { font-size: 12px; color: #666; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .f-status.ok { color: #1a7f37; }
  .f-status.err { color: var(--red); font-weight: bold; }

  /* Thanh Load từng ảnh */
  .progress-track {
    width: 100%;
    height: 4px;
    background: rgba(0,0,0,0.08);
    border-radius: 2px;
    margin-top: 6px;
    overflow: hidden;
    display: none;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--red), var(--orange));
    border-radius: 2px;
    transition: width 0.2s ease;
  }

  .btn-retry {
    background: var(--red); color: #fff; border: none; padding: 4px 10px;
    border-radius: 4px; font-size: 11px; cursor: pointer; display: none;
    font-family: var(--font-body); margin-top: 4px;
  }
  .btn-retry:hover { background: #b52a1c; }

  /* Thanh URL & Nút Copy */
  .url-box { display: none; width: 100%; }
  .url-group {
    display: flex; background: rgba(255,255,255,0.7); 
    border: 1.5px solid rgba(217,56,40,0.3);
    clip-path: polygon(var(--item-cut) 0, 100% 0, 100% calc(100% - var(--item-cut)), calc(100% - var(--item-cut)) 100%, 0 100%, 0 var(--item-cut));
    overflow: hidden;
  }
  .f-url {
    flex: 1; padding: 10px 12px; background: transparent; border: none;
    color: var(--red); font-family: var(--font-body); font-size: 12px; outline: none; width: 100%;
  }
  .btn-copy {
    background: var(--red); border: none; color: #fff; padding: 0 16px;
    cursor: pointer; font-family: var(--font-body); font-size: 13px; transition: .2s;
  }
  .btn-copy:hover { background: var(--orange); }

  .remove-btn {
    position: absolute; top: 10px; right: 12px; background: transparent;
    border: none; color: #888; cursor: pointer; transition: .2s; font-size: 18px;
    line-height: 1;
  }
  .remove-btn:hover { color: var(--red); }

  /* Toast */
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translate(-50%, 20px);
    background: rgba(20, 20, 20, 0.9); color: #fff; padding: 12px 24px; border-radius: 8px;
    font-family: var(--font-body); font-size: 14px; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    opacity: 0; pointer-events: none; transition: .3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 100;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 500px) {
    :root { --cut: 18px; }
    .content-area { padding: 20px 15px; }
    .btn-copy-all { padding: 12px; font-size: 14px; }
  }
</style>
</head>
<body>

<div class="glow" aria-hidden="true"></div>

<div class="glass-wrapper">
  <div class="glass-inner"></div>
  
  <div class="content-area">
    
    <div class="header">
      <img class="logo" src="https://azerst-image-vn.vercel.app/images/AVATA_AZERST.png" alt="Azerst" />
      <h1>AZERST UPLOAD</h1>
      <p class="desc">Tải ảnh nhanh, nhận link trực tiếp</p>
    </div>

    <div class="input-group">
      <label class="input-label" for="imageName">Tên ảnh muốn lưu (Không bắt buộc)</label>
      <input id="imageName" class="name-input" type="text" maxlength="50" placeholder="VD: AZERST_IMG" autocomplete="off" />
    </div>

    <!-- Vùng Upload -->
    <label class="upload-zone" for="file" id="dropZone">
      <h3>Chọn hoặc kéo thả ảnh</h3>
      <p>Hỗ trợ PNG, JPG, WEBP (Tối đa 10GB)</p>
    </label>
    <input id="file" type="file" multiple accept="image/png,image/jpeg,image/webp,image/gif,image/avif" />

    <!-- THANH LOAD TỔNG -->
    <div class="global-progress-container" id="globalProgressTrack">
      <div class="global-progress-fill" id="globalProgressFill"></div>
    </div>

    <!-- KHU VỰC HIỂN THỊ KẾT QUẢ -->
    <div id="resultSection" class="result-section">
      <button class="btn-copy-all" id="btnCopyAll" style="display: none;">COPY TẤT CẢ LINK</button>
      <div id="filesList" style="display: flex; flex-direction: column; gap: 12px;"></div>
    </div>

  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { upload } from "https://esm.sh/@vercel/blob@2.8.0/client";

const IMAGE_SERVER = "https://azerst-image-vn.vercel.app";
const MAX_SIZE = 10 * 1024 * 1024 * 1024;
const ALLOWED = ["image/png", "image/jpeg", "image/webp", "image/gif", "image/avif"];

const fileInput = document.getElementById("file");
const nameInput = document.getElementById("imageName");
const dropZone = document.getElementById("dropZone");
const resultSection = document.getElementById("resultSection");
const filesList = document.getElementById("filesList");
const btnCopyAll = document.getElementById("btnCopyAll");
const toast = document.getElementById("toast");
const globalTrack = document.getElementById("globalProgressTrack");
const globalFill = document.getElementById("globalProgressFill");

let uploads = [];
let idCounter = 0;
let isUploading = false;

// Hàm tiện ích
const randomName = () => Array.from(crypto.getRandomValues(new Uint8Array(8)), v => "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"[v % 62]).join("");
const getExt = (t) => ({"image/png":"png","image/jpeg":"jpg","image/webp":"webp","image/gif":"gif","image/avif":"avif"})[t];

// Làm sạch tên file triệt để
const cleanName = (v) => v.trim().normalize("NFD")
  .replace(/[\u0300-\u036f]/g, "") // Xoá dấu tiếng Việt
  .replace(/đ/g, "d").replace(/Đ/g, "D")
  .replace(/\s+/g, "_") // Thay khoảng trắng bằng gạch dưới
  .replace(/[^A-Za-z0-9_-]/g, ""); // Xoá các ký tự đặc biệt

const delay = (ms) => new Promise(res => setTimeout(res, ms));

const showToast = (msg) => {
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2500);
};

const copyText = async (text) => {
  try { await navigator.clipboard.writeText(text); return true; } 
  catch { 
    try {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); return true;
    } catch { return false; }
  }
};

// Tạo giao diện thẻ ảnh
function createItem(file, filename) {
  const id = ++idCounter;
  const thumbURL = URL.createObjectURL(file);
  const div = document.createElement("div");
  div.className = "file-item";
  div.dataset.id = id;
  div.innerHTML = `
    <div class="file-top">
      <div class="thumb"><img src="${thumbURL}" alt=""></div>
      <div class="info">
        <div class="f-name" title="${filename}">${filename}</div>
        <div class="f-status" id="st-${id}">
          <span>Đang chờ...</span>
        </div>
        <!-- Thanh Load từng ảnh -->
        <div class="progress-track" id="track-${id}">
          <div class="progress-fill" id="fill-${id}"></div>
        </div>
        <button class="btn-retry" data-retry="${id}">Thử lại</button>
      </div>
    </div>
    <div class="url-box" id="box-${id}">
      <div class="url-group">
        <input class="f-url" id="url-${id}" readonly>
        <button class="btn-copy" data-copy="${id}">COPY</button>
      </div>
    </div>
    <button class="remove-btn" data-remove="${id}">×</button>
  `;
  return { div, id };
}

// Cập nhật thanh Load Tổng
function updateGlobalProgress() {
  const total = uploads.length;
  if (total === 0) return;

  // Đếm số ảnh đã xong (thành công hoặc lỗi)
  const done = uploads.filter(u => u.status === "success" || u.status === "error").length;
  const percent = Math.round((done / total) * 100);
  
  globalFill.style.width = `${percent}%`;
  
  if (done === total) {
    setTimeout(() => {
      globalTrack.style.display = "none";
      globalFill.style.width = "0%";
    }, 1000);
  }
}

// Cập nhật nút Copy All
function updateUI() {
  const total = uploads.length;
  if (total === 0) { 
    resultSection.style.display = "none"; 
    return; 
  }
  
  if (total >= 2) {
    btnCopyAll.style.display = "block";
  } else {
    btnCopyAll.style.display = "none";
  }

  const success = uploads.filter(u => u.status === "success").length;
  btnCopyAll.disabled = success === 0;
}

// Hàm Upload với Phân loại Lỗi
async function uploadSingle(file, filename, id, attempt = 1) {
  const stEl = document.getElementById(`st-${id}`);
  const boxEl = document.getElementById(`box-${id}`);
  const urlEl = document.getElementById(`url-${id}`);
  const trackEl = document.getElementById(`track-${id}`);
  const fillEl = document.getElementById(`fill-${id}`);
  const retryBtn = stEl.parentElement.querySelector('.btn-retry');
  
  stEl.className = "f-status";
  stEl.querySelector('span').textContent = `Đang tải... (Lần ${attempt})`;
  retryBtn.style.display = "none";
  
  // Hiển thị thanh load
  trackEl.style.display = "block";
  fillEl.style.width = "0%";
  
  const entry = uploads.find(u => u.id === id);
  if(entry) entry.status = "uploading";

  try {
    await upload(`images/${filename}`, file, {
      access: "public",
      handleUploadUrl: IMAGE_SERVER + "/api/upload",
      multipart: true,
      onUploadProgress: (progress) => {
        const pct = Math.round(progress.percentage);
        fillEl.style.width = `${pct}%`;
        stEl.querySelector('span').textContent = `Đang tải... ${pct}%`;
      }
    });

    const finalURL = `${IMAGE_SERVER}/images/${encodeURIComponent(filename)}`;
    
    stEl.className = "f-status ok";
    stEl.querySelector('span').textContent = "✅ Tải lên thành công";
    fillEl.style.width = "100%";
    
    setTimeout(() => { trackEl.style.display = "none"; }, 500);
    
    boxEl.style.display = "block";
    urlEl.value = finalURL;

    if(entry) { entry.url = finalURL; entry.status = "success"; }

  } catch (err) {
    console.error(`Lỗi up ảnh ${filename} (Lần ${attempt}):`, err);
    
    // PHÂN LOẠI LỖI
    let errorMsg = err.message || "Lỗi không xác định";
    let isNetworkError = false;

    if (errorMsg.includes("fetch") || errorMsg.includes("network") || errorMsg.includes("Failed to fetch")) {
      isNetworkError = true;
    } else if (errorMsg.includes("Bad Request") || errorMsg.includes("400")) {
      errorMsg = "Lỗi tên file/ảnh không hợp lệ";
    } else if (errorMsg.includes("Unauthorized") || errorMsg.includes("401")) {
      errorMsg = "Lỗi xác thực Server (Token)";
    }

    // Tự động thử lại nếu là lỗi mạng
    if (isNetworkError && attempt < 5) {
      stEl.querySelector('span').textContent = `Lỗi mạng, thử lại sau ${attempt * 2}s...`;
      await delay(attempt * 2000);
      return uploadSingle(file, filename, id, attempt + 1);
    }

    // Nếu thất bại hoàn toàn hoặc lỗi không phải do mạng
    stEl.className = "f-status err";
    stEl.querySelector('span').textContent = `❌ Lỗi: ${errorMsg}`;
    retryBtn.style.display = "inline-block";
    fillEl.style.background = "#ff0000";
    stEl.closest(".file-item").classList.add("error-item");
    if(entry) entry.status = "error";
  }
  
  updateGlobalProgress();
  updateUI();
}

// Hàng đợi (Queue) chạy tuần tự
async function processQueue() {
  if (isUploading) return;
  isUploading = true;

  globalTrack.style.display = "block";
  globalFill.style.width = "0%";

  try {
    const pendingItems = uploads.filter(u => u.status === "pending");

    for (let i = 0; i < pendingItems.length; i++) {
      const item = pendingItems[i];
      if (!uploads.find(u => u.id === item.id)) continue;

      try {
        await uploadSingle(item.file, item.filename, item.id);
      } catch (e) {
        console.error("Lỗi nghiêm trọng ở item:", item.id, e);
      }
      
      if (i < pendingItems.length - 1) {
        await delay(1000); // Nghỉ 1s giữa các ảnh
      }
    }
  } finally {
    isUploading = false;
  }
}

// Xử lý chọn file
function handleFiles(files) {
  const validFiles = Array.from(files);
  if (!validFiles.length) return;

  const rawBaseName = nameInput.value;
  const baseName = cleanName(rawBaseName);
  
  // Cảnh báo nếu tên nhập vào chứa ký tự bị xoá
  if (rawBaseName && rawBaseName !== baseName && baseName === "") {
    showToast("Tên nhập vào chứa toàn ký tự không hợp lệ, dùng tên ngẫu nhiên!");
  }

  fileInput.value = "";

  for (let i = 0; i < validFiles.length; i++) {
    const f = validFiles[i];
    if (!ALLOWED.includes(f.type) || f.size > MAX_SIZE) {
      showToast(`File ${f.name} không hợp lệ!`);
      continue;
    }

    let name = baseName ? (validFiles.length > 1 ? `${baseName}_${i+1}` : baseName) : randomName();
    const filename = `${name}.${getExt(f.type)}`;

    const { div, id } = createItem(f, filename);
    filesList.appendChild(div);
    
    uploads.push({ id, file: f, filename, url: null, status: "pending" });
  }

  resultSection.style.display = "flex";
  updateUI();
  processQueue();
}

// Events
fileInput.addEventListener("change", () => handleFiles(fileInput.files));
dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("dragover"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
dropZone.addEventListener("drop", e => { e.preventDefault(); dropZone.classList.remove("dragover"); handleFiles(e.dataTransfer.files); });

// Tương tác thẻ
filesList.addEventListener("click", async (e) => {
  const copyBtn = e.target.closest("[data-copy]");
  const removeBtn = e.target.closest("[data-remove]");
  const retryBtn = e.target.closest("[data-retry]");

  if (copyBtn) {
    const id = copyBtn.dataset.copy;
    const entry = uploads.find(u => u.id == id);
    if (entry && entry.url) {
      const ok = await copyText(entry.url);
      if (ok) showToast("Sao chép thành công!");
    }
  }

  if (removeBtn) {
    const id = Number(removeBtn.dataset.remove);
    removeBtn.closest(".file-item").remove();
    uploads = uploads.filter(u => u.id !== id);
    updateUI();
    updateGlobalProgress();
  }

  if (retryBtn) {
    const id = Number(retryBtn.dataset.retry);
    const entry = uploads.find(u => u.id === id);
    if (entry) {
      entry.status = "pending";
      const itemEl = retryBtn.closest(".file-item");
      itemEl.classList.remove("error-item");
      document.getElementById(`fill-${id}`).style.background = "linear-gradient(90deg, var(--red), var(--orange))";
      processQueue();
    }
  }
});

// Copy tất cả
btnCopyAll.addEventListener("click", async () => {
  const urls = uploads.filter(u => u.status === "success" && u.url).map(u => u.url);
  if (urls.length === 0) return;
  const ok = await copyText(urls.join("\n"));
  if (ok) showToast(`Sao chép thành công ${urls.length} link!`);
});
</script>
